  }
}

function sauvegarderPanier() {
  try {
    localStorage.setItem(CLE_PANIER, JSON.stringify(etat.panier));
  } catch (erreur) {
    console.error('Impossible de sauvegarder le panier :', erreur);
  }
}

/* ============================================================
   CHARGEMENT TEMPS RÉEL DU CATALOGUE PUBLIC
   ============================================================ */
db.collection('publicCatalog').onSnapshot(
  (snapshot) => {
    etat.produits = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    etat.chargementTermine = true;
    rafraichirApresDonnees();
  },
  (erreur) => {
    console.error('Erreur de chargement du catalogue :', erreur);
    etat.chargementTermine = true;
    etat.erreurChargement = true;
    rendre();
  }
);

/* ============================================================
   CHARGEMENT TEMPS RÉEL DES RÉGLAGES DU SITE (siteSettings/main)
   ------------------------------------------------------------
   Si le document n'existe pas, ou si la lecture est refusée
   (règles pas encore publiées), le site garde ses valeurs
   par défaut. Un délai de secours évite de bloquer l'affichage
   si la réponse tarde.
   ============================================================ */
db.collection('siteSettings').doc('main').onSnapshot(
  (doc) => {
    etat.reglages = doc.exists ? (doc.data() || {}) : {};
    etat.reglagesCharges = true;
    rafraichirApresDonnees();
  },
  (erreur) => {
    console.warn('Réglages du site indisponibles, valeurs par défaut utilisées :', erreur);
    etat.reglages = {};
    etat.reglagesCharges = true;
    rafraichirApresDonnees();
  }
);

setTimeout(() => {
  if (!etat.reglagesCharges) {
    etat.reglagesCharges = true;
    rafraichirApresDonnees();
  }
}, 2000);

/* ============================================================
   RAFRAÎCHISSEMENT APRÈS MISE À JOUR DES DONNÉES
   ------------------------------------------------------------
   Le catalogue change à chaque commande (stock en temps réel).
   Pendant un pic de trafic, ça peut arriver toutes les quelques
   secondes. On ne doit donc PAS reconstruire :
   - le formulaire de commande (la cliente perdrait sa saisie),
   - la fiche produit si la cliente a déjà choisi une couleur
     ou une formule (sa sélection serait remise à zéro).
   Dans ces deux cas, seuls l'en-tête et le compteur du panier
   sont mis à jour.
   ============================================================ */
function rafraichirApresDonnees() {
  const saisieEnCours =
    etat.vueActuelle === 'commande' ||
    (etat.vueActuelle === 'produit' &&
      (etat.produitCourant.couleurChoisie || etat.produitCourant.formuleChoisie));

  if (saisieEnCours && document.getElementById('contenu-principal').dataset.vueRendue === etat.vueActuelle) {
    mettreAJourEnteteEtPied();
    mettreAJourNavigation();
    mettreAJourCompteurPanier();
    return;
  }
  rendre();
}

/* ============================================================
   NAVIGATION — basée sur l'URL (#...), pour que la page actuelle
   survive à un rechargement ou à un retour plus tard sur le site
   ============================================================ */

// Construit le hash d'URL correspondant à une vue donnée
function construireHash(vue, parametres) {
  if (vue === 'catalogue' && parametres.categorie) return '#catalogue/' + encodeURIComponent(parametres.categorie);
  if (vue === 'produit' && parametres.produitId) return '#produit/' + encodeURIComponent(parametres.produitId);
  if (vue === 'collection' && parametres.collectionId) return '#collection/' + encodeURIComponent(parametres.collectionId);
  if (vue === 'recherche') return '#recherche/' + encodeURIComponent(parametres.texte || '');
  return '#' + vue;
}

// Relit l'URL actuelle et en déduit la vue + les paramètres à afficher
function analyserHash() {
  const brut = window.location.hash.replace(/^#/, '');
  if (!brut) return { vue: 'accueil', parametres: {} };
  const [vue, param] = brut.split('/');
  if (vue === 'catalogue' && param) return { vue: 'catalogue', parametres: { categorie: decodeURIComponent(param) } };
  if (vue === 'produit' && param) return { vue: 'produit', parametres: { produitId: decodeURIComponent(param) } };
  if (vue === 'collection' && param) return { vue: 'collection', parametres: { collectionId: decodeURIComponent(param) } };
  if (vue === 'recherche') return { vue: 'recherche', parametres: { texte: decodeURIComponent(param || '') } };
  if (['accueil', 'panier', 'commande', 'confirmation', 'apropos'].includes(vue)) return { vue, parametres: {} };
  return { vue: 'accueil', parametres: {} };
}

// Change de page : met à jour l'URL, ce qui déclenche l'affichage
// (voir écouteur "hashchange" plus bas) et permet au navigateur de
// mémoriser la page en cours (rechargement, bouton précédent, partage de lien).
function naviguerVers(vue, parametres = {}) {
  const nouveauHash = construireHash(vue, parametres);
  if (window.location.hash === nouveauHash) {
    appliquerNavigation(vue, parametres); // déjà sur cette page : on force quand même le rendu
  } else {
    window.location.hash = nouveauHash;
  }
}

// Applique réellement le changement de vue (appelé après un changement d'URL)
function appliquerNavigation(vue, parametres) {
  const vuePrecedente = etat.vueActuelle; // page que la cliente quitte
  etat.vueActuelle = vue;
  etat.parametresVue = parametres;
  // Un achat direct ("Acheter maintenant") ne vaut que pour la page de
  // commande qui suit : si la cliente la quitte (retour, panier, accueil…),
  // il est oublié, et un nouveau choix repart de zéro.
  // Exception : si elle ouvre son panier depuis la page de commande, l'article
  // est mis dans le panier, pour qu'elle retrouve les mêmes articles que
  // dans sa commande (et le même nombre sur l'icône du panier).
  if (vue === 'panier' && vuePrecedente === 'commande') verserAchatDirectDansPanier();
  if (vue !== 'commande') etat.achatDirect = null;
  if (vue === 'produit') {
    etat.produitCourant = { couleurChoisie: null, tailleChoisie: null, quantiteChoisie: 1, formuleChoisie: null, selectionsPack: [] };
  }
  basculerMenuMobile(false);
  basculerRecherche(false);
  fermerBande();
  window.scrollTo({ top: 0, behavior: 'instant' });
  rendre();
  if (vue === 'produit') suivi.vueArticle(parametres.produitId);
  if (vue === 'commande') suivi.passageCommande();
}

// Réagit aux changements d'URL : rechargement de page, bouton précédent/suivant,
// ou ouverture directe d'un lien vers une catégorie/un produit précis.
window.addEventListener('hashchange', () => {
  const { vue, parametres } = analyserHash();
  appliquerNavigation(vue, parametres);
});

// Ordinateur : ouvre la bande « Collections » ou « Contact » sous la barre.
// Un 2e clic sur le même bouton la referme ; un clic sur l'autre bouton
// change simplement son contenu.
function basculerBande(nom) {
  etat.bandeOuverte = (etat.bandeOuverte === nom) ? null : nom;
  document.querySelectorAll('#nav-desktop .bouton-deroulant').forEach(b =>
    b.classList.toggle('ouvert', b.dataset.bande === etat.bandeOuverte));
  remplirBande();
}

function fermerBande() {
  if (!etat.bandeOuverte) return;
  basculerBande(etat.bandeOuverte);
}

// Remplit la bande avec les choix, alignés sous le bouton cliqué
function remplirBande() {
  const bande = document.getElementById('bande-deroulante');
  const nom = etat.bandeOuverte;
  bande.classList.toggle('ouverte', !!nom);
  if (!nom) { bande.innerHTML = ''; return; }

  const lignes = nom === 'collections'
    ? collectionsAffichees().map(col => `<a href="#" data-col="${echapper(col.id)}"
        onclick="ouvrirCollection(this); return false;">${echapper(col.label)}</a>`)
    : lignesContact(nom === 'reseaux' ? 'reseaux' : 'contact');
  bande.innerHTML = `<div class="liste-bande">${lignes.length ? lignes.join('') : messageVide(nom)}</div>`;

  const bouton = document.querySelector(`#nav-desktop .bouton-deroulant[data-bande="${nom}"]`);
  const gauche = bouton ? bouton.getBoundingClientRect().left : 40;
  bande.querySelector('.liste-bande').style.marginLeft = Math.round(gauche) + 'px';
}

// Petit texte gris quand une liste déroulante est vide (V2.19, choix d'Oussama)
function messageVide(nom) {
  const textes = {
    collections: 'Aucune collection pour le moment',
    contact: 'Aucun contact pour le moment',
    reseaux: 'Aucun réseau social pour le moment'
  };
  return `<span class="liste-vide">${textes[nom] || 'Rien pour le moment'}</span>`;
}

// Un clic ailleurs que dans la barre ferme la bande
document.addEventListener('click', e => {
  if (etat.bandeOuverte && !e.target.closest('header')) fermerBande();
});

// Ouvre/ferme le menu ☰ (panneau à gauche). Sans argument : inverse l'état.
function basculerMenuMobile(ouvrir) {
  const menu = document.getElementById('menu-mobile');
  const doitOuvrir = (typeof ouvrir === 'boolean') ? ouvrir : !menu.classList.contains('ouvert');
  menu.classList.toggle('ouvert', doitOuvrir);
  document.getElementById('voile-menu').classList.toggle('ouvert', doitOuvrir);
  if (doitOuvrir) basculerRecherche(false);
}

/* ============================================================
   RECHERCHE (loupe de l'en-tête)
   ------------------------------------------------------------
   Cherche dans le nom et la catégorie des articles, sans tenir
   compte des accents ni des majuscules. Les résultats s'affichent
   sous la barre, la page en dessous ne bouge pas.
   ============================================================ */
function basculerRecherche(ouvrir) {
  const panneau = document.getElementById('panneau-recherche');
  const doitOuvrir = (typeof ouvrir === 'boolean') ? ouvrir : !panneau.classList.contains('ouvert');
  panneau.classList.toggle('ouvert', doitOuvrir);
  // V2.25 : cache le demi-cercle de l'accueil pendant la recherche (voir CSS)
  document.body.classList.toggle('recherche-ouverte', doitOuvrir);
  if (doitOuvrir) {
    // Place le panneau juste sous l'en-tête, et le limite à la hauteur de l'écran
    const basEntete = document.querySelector('header').getBoundingClientRect().bottom;
    panneau.style.top = basEntete + 'px';
    panneau.style.maxHeight = (window.innerHeight - basEntete) + 'px';
    basculerMenuMobile(false);
    mettreAJourRecherche();
    document.getElementById('champ-recherche').focus();
  }
}

// Simplifie un texte pour la comparaison : minuscules, sans accents
function texteRecherche(texte) {
  return (texte || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Articles qui correspondent au texte tapé : un article correspond si TOUS
// les mots tapés se trouvent dans son nom ou sa catégorie
function articlesTrouves(texte) {
  const mots = texteRecherche(texte).split(/\s+/).filter(Boolean);
  if (!mots.length) return [];
  return etat.produits.filter(p => {
    const contenu = texteRecherche(p.name + ' ' + (p.cat || '') + ' ' + libelleCategorie(p.cat));
    return mots.every(m => contenu.includes(m));
  });
}

// Suggestions (V2.27) : catégories, noms d'articles et mots des noms qui
// contiennent le texte tapé. Ceux qui COMMENCENT par le texte passent en premier.
function suggestionsRecherche(texte) {
  const cherche = texteRecherche(texte).trim();
  if (!cherche) return [];
  const candidats = new Map(); // clé simplifiée -> texte affiché (sans doublons)
  const ajouter = (t) => {
    const propre = String(t || '').trim();
    const cle = texteRecherche(propre);
    if (propre.length >= 2 && !candidats.has(cle)) candidats.set(cle, propre);
  };
  categoriesAffichees().forEach(c => ajouter(c.label));
  etat.produits.forEach(p => {
    ajouter(p.name);
    String(p.name || '').split(/[\s,.'’-]+/).filter(m => m.length >= 3).forEach(m => ajouter(m.toLowerCase()));
  });
  const mots = cherche.split(/\s+/);
  return [...candidats.entries()]
    .filter(([cle]) => mots.every(m => cle.includes(m)))
    .sort(([a], [b]) => (b.startsWith(cherche) - a.startsWith(cherche)) || a.length - b.length)
    .slice(0, 6)
    .map(([, affiche]) => affiche);
}

// Ouvre la page « Résultats de recherche » pour le texte donné
function lancerRecherche(texte) {
  const propre = String(texte || '').trim();
  if (!propre) return;
  naviguerVers('recherche', { texte: propre });
}

function mettreAJourRecherche() {
  const panneau = document.getElementById('panneau-recherche');
  if (!panneau.classList.contains('ouvert')) return;
  const zone = document.getElementById('resultats-recherche');
  const texte = document.getElementById('champ-recherche').value.trim();
  if (!texte) { zone.innerHTML = ''; return; }
  const articles = articlesTrouves(texte).slice(0, 4);
  const suggestions = suggestionsRecherche(texte);
  // Le texte passe par JSON.stringify puis echapper() pour aller sans risque dans onclick
  const enAttribut = (t) => echapper(JSON.stringify(t));
  zone.innerHTML = `
    <div class="apercu-recherche">
      <div class="colonne-articles">
        <h4>Articles</h4>
        ${articles.length ? articles.map(p => {
          const { actuel, ancien } = prixUnitaireEffectif(p);
          const photo = urlSure(photoParDefaut(p));
          return `
            <div class="apercu-article" onclick="naviguerVers('produit', {produitId: ${enAttribut(p.id)}})">
              ${photo ? `<img class="vignette" src="${echapper(photoOptimisee(photo, 120))}" alt="">` : `<div class="vignette"></div>`}
              <div>
                <div class="categorie-apercu">${echapper(libelleCategorie(p.cat))}</div>
                <div class="nom-apercu">${echapper(p.name)}</div>
                <div class="prix-apercu">${ancien ? `<span class="prix-barre">${prixFormat(ancien)}</span>` : ''}${prixFormat(actuel)}</div>
              </div>
            </div>`;
        }).join('') : `<div class="rien-trouve">Aucun article trouvé.</div>`}
      </div>
      ${suggestions.length ? `
        <div class="colonne-suggestions">
          <h4>Suggestions</h4>
          ${suggestions.map(t => `<button class="suggestion-recherche" onclick="lancerRecherche(${enAttribut(t)})">${echapper(t)}</button>`).join('')}
        </div>` : ''}
    </div>
    <button class="ligne-rechercher-tout" onclick="lancerRecherche(${enAttribut(texte)})">
      <span>Rechercher « ${echapper(texte)} »</span>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
    </button>`;
}

/* ============================================================
   UTILITAIRES PRODUITS
   ============================================================ */
function produitsParCategorie(cat) {
  return etat.produits.filter(p => normaliser(p.cat) === normaliser(cat));
}

function trouverProduit(id) {
  return etat.produits.find(p => p.id === id);
}

function photoParDefaut(produit) {
  const v = (produit.variants || []).find(v => (v.photos && v.photos.length) || v.photo);
  return v ? photosVariante(v)[0] : '';
}

// Retourne la liste des photos d'une variante : utilise le nouveau champ
// "photos" (tableau) s'il existe, sinon replie sur l'ancien champ "photo" (unique)
// pour rester compatible avec les produits déjà existants.
function photosVariante(variant) {
  if (!variant) return [];
  // V2.29 : on ne garde que les vraies adresses https:// (sécurité)
  if (variant.photos && variant.photos.length) return variant.photos.map(u => urlSure(u)).filter(Boolean);
  if (variant.photo) return [urlSure(variant.photo)].filter(Boolean);
  return [];
}

function prixFormat(prix) {
  return (Number(prix) || 0).toFixed(3) + ' DT';
}

// Retourne le prix unitaire à afficher/utiliser pour un produit, en tenant
// compte d'une éventuelle promotion simple (promoPrix < price).
function prixUnitaireEffectif(produit) {
  const prixNormal = Number(produit.price) || 0;
  const enPromo = produit.promoPrix !== undefined && produit.promoPrix !== null && Number(produit.promoPrix) < prixNormal;
  return {
    actuel: enPromo ? Number(produit.promoPrix) : prixNormal,
    ancien: enPromo ? prixNormal : null
  };
}

function stockTotalDisponible(produit) {
  return (produit.variants || []).reduce((total, v) => total + (Number(v.qty) || 0), 0);
}

function capitaliser(texte) {
  return texte.charAt(0).toUpperCase() + texte.slice(1);
}

function mettreAJourCompteurPanier() {
  // Sur la page de commande d'un « Acheter maintenant », l'icône compte aussi
  // l'article acheté : le chiffre correspond ainsi aux articles de la commande.
  const lignes = (etat.vueActuelle === 'commande') ? lignesACommander() : etat.panier;
  const total = lignes.reduce((s, l) => s + l.qty, 0);
  const badge = document.getElementById('compteur-panier');
  if (total > 0) { badge.style.display = 'flex'; badge.textContent = total; }

function afficherToast(message) {
  const toast = document.getElementById('toast-panier');
  toast.textContent = message;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 2200);
}

/* ============================================================
   RENDU PRINCIPAL — bascule selon la vue active
   ============================================================ */
function rendre() {
  document.getElementById('annee-courante').textContent = new Date().getFullYear();
  mettreAJourEnteteEtPied();
  mettreAJourNavigation();
  mettreAJourCompteurPanier();

  const conteneur = document.getElementById('contenu-principal');

  // On attend le catalogue ET les réglages (ou le délai de secours) avant le
  // premier affichage, pour ne pas montrer la vidéo par défaut puis la remplacer.
  if (!etat.chargementTermine || !etat.reglagesCharges) {
    conteneur.innerHTML = `<div class="chargement-page">Chargement de la boutique…</div>`;
    conteneur.dataset.vueRendue = '';
    return;
  }
  if (etat.erreurChargement) {
    conteneur.innerHTML = `<div class="chargement-page">La boutique n'a pas pu se charger pour le moment. Merci de réessayer dans un instant.</div>`;
    conteneur.dataset.vueRendue = '';
    return;
  }

  // Repère « page d'accueil » pour le demi-cercle (le logo y quitte la barre du haut)
  const vuesAutres = ['recherche', 'catalogue', 'collection', 'produit', 'panier', 'commande', 'confirmation', 'apropos'];
  const surAccueil = !vuesAutres.includes(etat.vueActuelle);
  document.body.classList.toggle('sur-accueil', surAccueil);
  // V2.28 : pages en grille d'articles, plus larges (voir CSS body.page-grille)
  document.body.classList.toggle('page-grille', ['catalogue', 'collection', 'recherche'].includes(etat.vueActuelle));
  // Le demi-cercle est dans la barre du haut : il reste collé à elle
  // quand on descend ou remonte dans la page (V2.19, choix d'Oussama)
  const dome = document.getElementById('dome-entete');
  if (surAccueil && !dome.innerHTML) dome.innerHTML = domeAccueilHTML(reglageTexte('brand', 'name'));
  if (!surAccueil) dome.innerHTML = '';

  switch (etat.vueActuelle) {
    case 'catalogue': conteneur.innerHTML = vueCatalogue(etat.parametresVue.categorie); break;
    case 'collection': conteneur.innerHTML = vueCatalogue(null, etat.parametresVue.collectionId); break;
    case 'recherche': conteneur.innerHTML = vueRecherche(etat.parametresVue.texte); break;
    case 'produit': conteneur.innerHTML = vueProduit(etat.parametresVue.produitId); break;
    case 'panier': conteneur.innerHTML = vuePanier(); break;
    case 'commande': conteneur.innerHTML = vueCommande(); break;
    case 'confirmation': conteneur.innerHTML = vueConfirmation(); break;
    case 'apropos': conteneur.innerHTML = vueAPropos(); break;
    default: rendreAccueil(conteneur); // 'accueil' et toute vue inconnue
  }
  conteneur.dataset.vueRendue = etat.vueActuelle;

  // Ré-attache les écouteurs spécifiques à la vue produit / formulaire après insertion du HTML
  if (etat.vueActuelle === 'produit') initialiserFicheProduit(etat.parametresVue.produitId);
  if (etat.vueActuelle === 'commande') initialiserFormulaireCommande();
}

// Affiche la page d'accueil en deux zones :
// - le héros (vidéo/image du haut),
// - les blocs en dessous.
// Si le héros n'a pas changé, on ne remplace que les blocs : la vidéo
// continue de tourner au lieu de redémarrer à chaque mise à jour du stock.
function rendreAccueil(conteneur) {
  const hero = heroAccueil();
  const zoneHero = document.getElementById('zone-hero');
  const zoneBlocs = document.getElementById('zone-accueil-blocs');

  if (zoneHero && zoneBlocs && conteneur.contains(zoneHero) && zoneHero.dataset.signature === hero.signature) {
    // On garde la position des carrousels : une mise à jour du stock ne doit pas les ramener au début
    const positions = [...zoneBlocs.querySelectorAll('.tuiles-categories')].map(p => p.scrollLeft);
    zoneBlocs.innerHTML = blocsAccueilHTML();
    zoneBlocs.querySelectorAll('.tuiles-categories').forEach((p, i) => { if (positions[i]) p.scrollLeft = positions[i]; });
  } else {
    conteneur.innerHTML = `
      <div id="zone-hero" data-signature="${echapper(hero.signature)}">${hero.html}</div>
      <div id="zone-accueil-blocs">${blocsAccueilHTML()}</div>
    `;
  }
  majTousLesCarrousels();
}

// Construit le héros à partir des réglages (type vidéo ou image).
// Sans média valide dans le dashboard, on garde la vidéo par défaut.
function heroAccueil() {
  const brut = etat.reglages.hero || {};
  const mediaPerso = urlSure(brut.mediaUrl, '');
  const type = mediaPerso ? (brut.type === 'image' ? 'image' : 'video') : 'video';
  // V6.0 : sans vidéo choisie dans Apparence, écran plus large que haut (PC) = vidéo en largeur
  const ecranLarge = (window.innerWidth || 0) > (window.innerHeight || 0);
  const media = mediaPerso || (ecranLarge ? REGLAGES_PAR_DEFAUT.hero.mediaUrlPc : REGLAGES_PAR_DEFAUT.hero.mediaUrl);
  const affiche = urlSure(brut.posterUrl, '') || reglageUrl('brand', 'logoUrl');
  const nom = reglageTexte('brand', 'name');
  const texte = reglageTexte('hero', 'text');
  const libelleBouton = reglageTexte('hero', 'buttonLabel');
  const lienBouton = brut.buttonLink || REGLAGES_PAR_DEFAUT.hero.buttonLink;

  const mediaHTML = type === 'image'
    ? `<img class="media-hero" src="${echapper(photoOptimisee(media, 'ecran'))}" alt="${echapper(nom)}">`
    : `<video autoplay muted loop playsinline poster="${echapper(photoOptimisee(affiche, 'ecran'))}">
         <source src="${echapper(videoOptimisee(media))}" type="video/mp4">
       </video>`;

  const html = `
    <section class="hero-video-section">
      ${mediaHTML}
      <div class="hero-video-texte">
        <p>${echapper(texte)}</p>
        <button class="bouton-principal" ${lienAttributs(lienBouton)}>${echapper(libelleBouton)}</button>
      </div>
    </section>
  `;
  // La signature résume ce qui, s'il change, impose de reconstruire le héros
  const signature = JSON.stringify([type, media, affiche, nom, texte, libelleBouton, lienBouton]);
  return { html, signature };
}

// Demi-cercle crème de l'accueil, bordé d'une branche à feuilles, avec le
// logo dedans. Dessin calculé ici (aucune image à télécharger) :
// - le demi-cercle est la moitié basse d'une ellipse collée à la barre du haut,
// - la branche suit son bord avec une légère ondulation,
// - les feuilles (contour noir comme le logo, fond crème pour rester
//   visibles sur la vidéo) partent de la branche, une dehors, une dedans.
function domeAccueilHTML(nom) {
  // Demi-cercle = morceau de cercle coupé par la barre du haut :
  // largeur 400, profondeur 140 (unités du dessin).
  const CX = 200, LARG = 200, PROF = 140;
  const R = (LARG * LARG + PROF * PROF) / (2 * PROF);  // rayon du cercle
  const CY = PROF - R;                                 // centre (au-dessus de la barre)
  const ENCRE = '#2A2326', CREME = '#FBF6F5';

  // 1. Trajet de la branche : petite racine qui sort à gauche, le bord du
  //    demi-cercle (avec une légère ondulation), puis une racine à droite.
  const trajet = [];
  for (let k = 0; k <= 20; k++) {                      // racine gauche
    const u = k / 20;
    trajet.push([-28 + 28 * u, 16 - 18 * u + 6 * Math.sin(u * Math.PI)]);
  }
  const phi0 = Math.asin(LARG / R);
  for (let k = 0; k <= 120; k++) {                     // bord du demi-cercle
    const phi = phi0 - 2 * phi0 * k / 120;              // de gauche à droite
    const r = R + 1.5 + 2.2 * Math.sin(phi * 9);
    trajet.push([CX - r * Math.sin(phi), CY + r * Math.cos(phi)]);
  }
  for (let k = 0; k <= 20; k++) {                      // racine droite
    const u = k / 20;
    trajet.push([400 + 30 * u, -2 + 20 * u - 5 * Math.sin(u * Math.PI)]);
  }
  const branche = `<polyline points="${trajet.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${ENCRE}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`;

  // 2. Feuilles réparties le long de la branche. Chacune : forme pointue
  //    un peu courbée, nervure, fond crème (visible sur la vidéo).
  //    La plupart pendent vers l'extérieur ; quelques-unes rentrent.
  const feuille = (x, y, angle, taille) => `
    <g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${angle.toFixed(1)}) scale(${taille.toFixed(2)})">
      <path d="M0 0 C6 -7, 15 -8, 23 -1 C15 4, 6 4, 0 0 Z" fill="${CREME}" stroke="${ENCRE}" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M1 0 C8 -2, 15 -2, 21 -1" fill="none" stroke="${ENCRE}" stroke-width="0.7"/>
    </g>`;
  const feuilles = [];
  const NB = 19;
  for (let i = 0; i < NB; i++) {
    const idx = Math.round(4 + (trajet.length - 9) * i / (NB - 1));
    const [x, y] = trajet[idx], [x2, y2] = trajet[idx + 1];
    const tangente = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI;
    // Côté extérieur : celui qui s'éloigne du centre du cercle
    const nx = -(y2 - y), ny = x2 - x;
    const exterieur = ((x - CX) * nx + (y - CY) * ny) > 0 ? 1 : -1;
    const dedans = i % 4 === 2;                        // 1 feuille sur 4 rentre
    const cote = dedans ? -exterieur : exterieur;
    const ecart = 38 + 14 * Math.sin(i * 2.3);         // angles variés
    const taille = 0.85 + 0.25 * Math.abs(Math.sin(i * 1.3));
    feuilles.push(feuille(x, y, tangente + cote * ecart, taille));
    // De temps en temps, une deuxième petite feuille au même endroit
    if (i % 3 === 0) feuilles.push(feuille(x, y, tangente + cote * (ecart + 32), taille * 0.7));
  }

  return `
    <div class="dome-accueil">
      <svg viewBox="0 0 400 165" aria-hidden="true">
        <path d="M0 0 A${R.toFixed(1)} ${R.toFixed(1)} 0 0 0 400 0 Z" fill="${CREME}"/>
        ${branche}
        ${feuilles.join('')}
      </svg>
      <img src="logo-nom.png" width="750" height="358" alt="${echapper(nom)}" onclick="naviguerVers('accueil')">
    </div>`;
}

// Liste des blocs à afficher sous le héros. Sans blocs dans le dashboard,
// on garde la disposition d'origine : catégories puis nouveautés.
function blocsAccueil() {
  const blocs = etat.reglages && Array.isArray(etat.reglages.blocks) ? etat.reglages.blocks : [];
  const visibles = blocs.filter(b => b && b.type && b.visible !== false);
  if (visibles.length) return visibles;
  return [{ type: 'categories' }, { type: 'nouveautes' }];
}

function blocsAccueilHTML() {
  return blocsAccueil().map(bloc => {
    switch (bloc.type) {
      case 'banner': return blocBanniereHTML(bloc);
      case 'products': return blocProduitsHTML(bloc.title, (Array.isArray(bloc.productIds) ? bloc.productIds : []).slice(0, 12).map(trouverProduit).filter(Boolean));
      case 'categories': return blocCategoriesHTML(bloc.title);
      case 'text': return blocTexteHTML(bloc);
      case 'image': return blocImageHTML(bloc);
      case 'nouveautes': return blocProduitsHTML('Nouveautés', etat.produits.slice(0, 8)); // bloc interne par défaut
      default: return ''; // type inconnu : ignoré, sans casser la page
    }
  }).join('');
}

// Grande bannière : photo + titre + sous-titre + bouton
function blocBanniereHTML(bloc) {
  const image = urlSure(bloc.imageUrl, '');
  const titre = bloc.title ? `<h2>${echapper(bloc.title)}</h2>` : '';
  const sousTitre = bloc.subtitle ? `<p>${echapper(bloc.subtitle)}</p>` : '';
  const bouton = bloc.buttonLabel ? `<span class="bouton-principal">${echapper(bloc.buttonLabel)}</span>` : '';
  if (!image) {
    // Sans photo, la bannière devient un bloc texte avec bouton
    return `
      <div class="bloc-texte">
        ${titre}${sousTitre}
        ${bloc.buttonLabel ? `<button class="bouton-principal" ${lienAttributs(bloc.link)}>${echapper(bloc.buttonLabel)}</button>` : ''}
      </div>`;
  }
  return `

/* ============================================================
   CARROUSEL DES CATÉGORIES SUR PC : flèches + glisser à la souris
   ------------------------------------------------------------
   Sur iPhone, le glissement au doigt est natif. Sur PC, la souris
   ne sait pas faire défiler une zone horizontale : on ajoute
   des flèches et le « cliquer-glisser ». Les écouteurs sont posés
   une seule fois sur le document, car le carrousel est recréé à
   chaque mise à jour du catalogue.
   ============================================================ */

// Fait défiler d'une photo vers la gauche (-1) ou la droite (1)
function defilerCategories(bouton, sens) {
  const piste = bouton.parentElement.querySelector('.tuiles-categories');
  const tuile = piste.querySelector('.tuile-categorie');
  const pas = tuile ? tuile.getBoundingClientRect().width + 14 : piste.clientWidth * 0.8;
  piste.scrollBy({ left: sens * pas, behavior: 'smooth' });
}

// Masque la flèche gauche au début et la flèche droite à la fin
function majFlechesCarrousel(piste) {
  const conteneur = piste.parentElement;
  const gauche = conteneur.querySelector('.fleche-carrousel.gauche');
  const droite = conteneur.querySelector('.fleche-carrousel.droite');
  if (!gauche || !droite) return;
  const max = piste.scrollWidth - piste.clientWidth;
  gauche.classList.toggle('inactive', piste.scrollLeft <= 4);
  droite.classList.toggle('inactive', piste.scrollLeft >= max - 4);
}

function majTousLesCarrousels() {
  document.querySelectorAll('.tuiles-categories').forEach(majFlechesCarrousel);
}

// Défilement (molette, flèches, glisser) : mise à jour des flèches
document.addEventListener('scroll', (e) => {
  if (e.target && e.target.classList && e.target.classList.contains('tuiles-categories')) {
    majFlechesCarrousel(e.target);
  }
}, true);
window.addEventListener('resize', majTousLesCarrousels);

// Glisser à la souris
const glissement = { piste: null, departX: 0, departScroll: 0, aBouge: false };
let annulerProchainClic = false;

document.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  const piste = e.target.closest && e.target.closest('.tuiles-categories');
  if (!piste) return;
  glissement.piste = piste;
  glissement.departX = e.clientX;
  glissement.departScroll = piste.scrollLeft;
  glissement.aBouge = false;
});

document.addEventListener('pointermove', (e) => {
  const piste = glissement.piste;
  if (!piste) return;
  const ecart = e.clientX - glissement.departX;
  if (!glissement.aBouge && Math.abs(ecart) > 6) {
    glissement.aBouge = true;
    piste.classList.add('en-glissement'); // coupe l'aimantation pendant le glisser
  }
  if (glissement.aBouge) piste.scrollLeft = glissement.departScroll - ecart;
});

document.addEventListener('pointerup', () => {
  const piste = glissement.piste;
  if (!piste) return;
  if (glissement.aBouge) {
    annulerProchainClic = true; // un glisser ne doit pas ouvrir la catégorie
    piste.classList.remove('en-glissement'); // l'aimantation recale sur la photo la plus proche
  }
  glissement.piste = null;
});

// Bloque le clic qui suit un glisser (phase de capture : avant le onclick de la tuile)
document.addEventListener('click', (e) => {
  if (annulerProchainClic) {
    annulerProchainClic = false;
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

// Empêche le navigateur de « déplacer » l'image au lieu de faire défiler
document.addEventListener('dragstart', (e) => {
  if (e.target.closest && e.target.closest('.tuiles-categories')) e.preventDefault();
});

// Texte libre : titre + paragraphes
// Bloc texte, avec en option une photo, un GIF ou une courte vidéo à côté :
// - PC : texte d'un côté, média de l'autre (mediaSide : 'right' par défaut, ou 'left')
// - iPhone : média à droite = sous le texte, média à gauche = au-dessus (V2.21)
// - le média prend toute la largeur de l'écran (voir le CSS .media-bloc)
function blocTexteHTML(bloc) {
  const media = urlSure(bloc.mediaUrl, '');
  if (!bloc.title && !bloc.body && !media) return '';

  const texte = `
      <div class="texte-bloc">
        ${bloc.title ? `<h2>${echapper(bloc.title)}</h2>` : ''}
        ${paragraphesHTML(bloc.body)}
      </div>`;
  if (!media) return `<div class="bloc-texte">${texte}</div>`;

  // Vidéo si le type le dit, ou si l'adresse finit par .mp4 / .webm ; sinon image (GIF compris)
  const estVideo = bloc.mediaType === 'video' || /\.(mp4|webm)(\?|#|$)/i.test(media);
  const mediaHTML = estVideo
    ? `<video src="${echapper(videoOptimisee(media))}" autoplay muted loop playsinline preload="metadata"></video>`
    : `<img src="${echapper(photoOptimisee(media, 1000))}" alt="${echapper(bloc.title || '')}" loading="lazy">`;
  const cote = bloc.mediaSide === 'left' ? 'media-gauche' : 'media-droite';

  return `
    <div class="bloc-texte avec-media ${cote}">
      <div class="media-bloc">${mediaHTML}</div>
      ${texte}
    </div>`;
}

// Image seule, avec lien optionnel
function blocImageHTML(bloc) {
  const image = urlSure(bloc.imageUrl, '');
  if (!image) return '';
  const img = `<img src="${echapper(photoOptimisee(image, 'ecran'))}" alt="" loading="lazy">`;
  return bloc.link
    ? `<a href="#" class="bloc-image" ${lienAttributs(bloc.link)}>${img}</a>`
    : `<div class="bloc-image">${img}</div>`;
}

/* ============================================================
   VUE — CATALOGUE
   ============================================================ */
function vueCatalogue(categorie, collectionId) {
  let produits = categorie ? produitsParCategorie(categorie) : etat.produits;
  // Page d'une collection : seulement ses articles
  const collection = collectionId ? collectionsAffichees().find(c => c.id === collectionId) : null;
  if (collectionId) produits = etat.produits.filter(p => p.collection === collectionId);

  // Filtre "disponible seulement"
  if (etat.filtresCatalogue.disponibleSeulement) {
    produits = produits.filter(p => stockTotalDisponible(p) > 0);
  }

  // Tri
  produits = [...produits];
  if (etat.filtresCatalogue.tri === 'prix-asc') {
    produits.sort((a, b) => prixUnitaireEffectif(a).actuel - prixUnitaireEffectif(b).actuel);
  } else if (etat.filtresCatalogue.tri === 'prix-desc') {
    produits.sort((a, b) => prixUnitaireEffectif(b).actuel - prixUnitaireEffectif(a).actuel);
  }
  // 'defaut' : ordre tel que reçu de publicCatalog (le plus proche d'un ordre "nouveautés")

  return `
    <div class="bloc-section" style="margin-top:30px; position:relative;">
      ${petalesDecorHTML()}
      <div class="entete-section" style="position:relative; z-index:1;">
        <h2>${collectionId ? echapper(collection ? collection.label : 'Collection') : categorie ? echapper(libelleCategorie(categorie)) : 'Toute la collection'}</h2>
      </div>

      <div class="barre-filtre" style="position:relative; z-index:1;">
        <span class="compte-produits">${produits.length} produit${produits.length > 1 ? 's' : ''}</span>
        <div class="controles-filtre">
          <label class="case-disponible">
            <input type="checkbox" ${etat.filtresCatalogue.disponibleSeulement ? 'checked' : ''} onchange="changerDisponibiliteCatalogue(this.checked)">
            En stock seulement
          </label>
          <select class="select-tri" onchange="changerTriCatalogue(this.value)">
            <option value="defaut" ${etat.filtresCatalogue.tri === 'defaut' ? 'selected' : ''}>Trier : nouveautés</option>
            <option value="prix-asc" ${etat.filtresCatalogue.tri === 'prix-asc' ? 'selected' : ''}>Prix croissant</option>
            <option value="prix-desc" ${etat.filtresCatalogue.tri === 'prix-desc' ? 'selected' : ''}>Prix décroissant</option>
          </select>
        </div>
      </div>

      ${produits.length
        ? `<div class="grille-produits" style="position:relative; z-index:1;">${produits.map(carteProduitHTML).join('')}</div>`
        : `<div class="message-vide" style="position:relative; z-index:1;">
             Aucun article disponible pour le moment avec ces filtres.
             ${etat.produits.length ? `<div style="margin-top:14px; font-size:0.75rem; opacity:0.6;">
               (Catégories trouvées dans le catalogue : ${echapper([...new Set(etat.produits.map(p => p.cat))].join(', '))})
             </div>` : ''}
           </div>`}
    </div>
  `;
}

  return `

        ${produit.ref ? `<div class="ref">Réf. ${echapper(produit.ref)}</div>` : ''}

        <div class="bloc-choix">

          <div class="tuiles-formule" id="tuiles-formule">
            ${tuileFormuleHTML('unitaire', 1, actuel, null, false)}
            ${produit.promoPaliers.map((palier, i) =>
              tuileFormuleHTML(i, palier.qte, palier.prixTotal, (Number(produit.price) * palier.qte) - palier.prixTotal, !!palier.meilleureOffre)

function initialiserFicheProduit(produitId) {
  // Les interactions passent par les fonctions choisirCouleur / choisirTaille /
  // changerQuantite ci-dessous. V2.35 : après un rafraîchissement, on remet
  // les choix que la cliente avait faits.
  remettreChoixProduit(produitId);
}

function choisirCouleur(produitId, couleur) {
  const produit = trouverProduit(produitId);
  etat.produitCourant.couleurChoisie = couleur;
  etat.produitCourant.tailleChoisie = null;
  etat.produitCourant.quantiteChoisie = 1;

  // Met à jour visuellement le swatch sélectionné
  document.querySelectorAll('.swatch-couleur').forEach(el => {
    el.classList.toggle('selectionne', el.dataset.couleur === couleur);
  });

  // Affiche le nom de la couleur choisie à côté du mot « Couleur »
  // (ex. « Couleur : Jaune »). Le nom est échappé avant d'être inséré.
  const nomCouleur = document.getElementById('nom-couleur-choisie');
  if (nomCouleur) {
    nomCouleur.innerHTML = couleur ? ' : ' + echapper(couleur) : '';
  }

  // Met à jour la photo principale + la galerie de miniatures pour cette couleur
  const varianteCouleur = (produit.variants || []).find(v => v.color === couleur && ((v.photos && v.photos.length) || v.photo));
  const photos = photosVariante(varianteCouleur);
  if (photos.length) {
    document.getElementById('photo-produit-principale').src = photoOptimisee(photos[0], 800);
  }
  const conteneurGalerie = document.getElementById('galerie-miniatures');
  if (photos.length > 1) {
    conteneurGalerie.innerHTML = photos.map((url, i) => `
      <button type="button" class="miniature-photo ${i === 0 ? 'selectionnee' : ''}" onclick="selectionnerPhoto(${enJs(url)}, this)">
        <img src="${echapper(photoOptimisee(url, 120))}" alt="${echapper(produit.name)}">
      </button>
    `).join('');
  } else {
    conteneurGalerie.innerHTML = '';
  }

  // Construit les tailles disponibles pour cette couleur
  const taillesPourCouleur = (produit.variants || []).filter(v => v.color === couleur);
  const conteneurTailles = document.getElementById('options-taille');
  conteneurTailles.innerHTML = taillesPourCouleur.map(v => `
    <button type="button" class="bouton-taille" data-taille="${echapper(v.size)}"
      ${Number(v.qty) <= 0 ? 'disabled' : ''}
      onclick="choisirTaille(${enJs(produitId)}, ${enJs(v.color)}, ${enJs(v.size)})">
      ${echapper(v.size)}
    </button>
  `).join('');

  document.getElementById('stock-info').textContent = '';
  actualiserBoutonAjouter(produitId);
}

function selectionnerPhoto(url, boutonClique) {
  document.getElementById('photo-produit-principale').src = photoOptimisee(url, 800);
  document.querySelectorAll('.miniature-photo').forEach(el => el.classList.remove('selectionnee'));
  boutonClique.classList.add('selectionnee');
}

function choisirTaille(produitId, couleur, taille) {
  etat.produitCourant.tailleChoisie = taille;
  etat.produitCourant.quantiteChoisie = 1;
  document.getElementById('quantite-choisie').textContent = '1';

  document.querySelectorAll('.bouton-taille').forEach(el => {
    el.classList.toggle('selectionne', el.dataset.taille === taille);
  });

  const produit = trouverProduit(produitId);
  const variante = (produit.variants || []).find(v => v.color === couleur && v.size === taille);
  const infoStock = document.getElementById('stock-info');
  if (variante) {
    if (variante.qty <= 3) {
      infoStock.textContent = `Plus que ${variante.qty} en stock`;
      infoStock.classList.add('faible');
    } else {
      infoStock.textContent = `En stock`;
      infoStock.classList.remove('faible');
    }
  }
  actualiserBoutonAjouter(produitId);
}

// V2.30 : au plus 20 pièces du même article par commande (même limite que
// le serveur, qui refuserait sinon la commande avec un message peu clair).
const MAX_PAR_ARTICLE = 20;
function plafond(stock) {
  return Math.min(Math.max(0, Number(stock) || 0), MAX_PAR_ARTICLE);
}

function changerQuantite(delta) {
  const produit = trouverProduit(etat.parametresVue.produitId);
  const variante = varianteChoisie(produit);
  const max = variante ? plafond(variante.qty) : 1;
  let nouvelle = etat.produitCourant.quantiteChoisie + delta;
  if (variante && delta > 0 && nouvelle > MAX_PAR_ARTICLE) afficherToast('Maximum 20 pièces par article et par commande');
  nouvelle = Math.max(1, Math.min(nouvelle, max || 1));
  etat.produitCourant.quantiteChoisie = nouvelle;
  document.getElementById('quantite-choisie').textContent = nouvelle;
}

function varianteChoisie(produit) {
  if (!produit || !etat.produitCourant.couleurChoisie || !etat.produitCourant.tailleChoisie) return null;
  return (produit.variants || []).find(v =>
    v.color === etat.produitCourant.couleurChoisie && v.size === etat.produitCourant.tailleChoisie
  );
}

function actualiserBoutonAjouter(produitId) {
  const produit = trouverProduit(produitId);
  const variante = varianteChoisie(produit);
  const bouton = document.getElementById('bouton-ajouter');
  const boutonAchat = document.getElementById('bouton-acheter-maintenant');
  if (!etat.produitCourant.couleurChoisie) {
    bouton.disabled = true; bouton.textContent = 'Choisir une couleur';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }
  if (!variante) {
    bouton.disabled = true; bouton.textContent = 'Choisir une taille';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }
  if (Number(variante.qty) <= 0) {
    bouton.disabled = true; bouton.textContent = 'Épuisé dans cette taille';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }
  bouton.disabled = false; bouton.textContent = 'Ajouter au panier';
  if (boutonAchat) boutonAchat.disabled = false;
}

// Place l'article choisi (couleur + taille + quantité) dans la liste "lignes".
// "lignes" est soit le panier, soit la liste d'un achat direct (bouton
// "Acheter maintenant"). Renvoie true si l'article a bien été placé.
function placerArticleDans(lignes, produitId) {
  const produit = trouverProduit(produitId);
  const variante = varianteChoisie(produit);
  if (!produit || !variante) return false;

  const { actuel } = prixUnitaireEffectif(produit);
  const ligneExistante = lignes.find(l => l.productId === produitId && l.variantId === variante.id && !l.packId);
  const quantiteDemandee = etat.produitCourant.quantiteChoisie;

  if (ligneExistante) {
    ligneExistante.qty = Math.min(ligneExistante.qty + quantiteDemandee, plafond(variante.qty));
  } else {
    lignes.push({
      productId: produitId,
      variantId: variante.id,
      name: produit.name,
      cat: produit.cat,
      price: actuel,
      size: variante.size,
      color: variante.color,
      photo: photosVariante(variante)[0] || photoParDefaut(produit),
      qty: quantiteDemandee,
      stockDispo: plafond(variante.qty)
    });
  }
  return true;
}

function ajouterAuPanier(produitId) {
  if (!placerArticleDans(etat.panier, produitId)) return;

  mettreAJourCompteurPanier();
  sauvegarderPanier();
  suivi.ajoutPanier(produitId);
  afficherToast('Article ajouté au panier');
}

/* ============================================================
   FORMULES / PALIERS DE QUANTITÉ (ex : 1 / 2 / 3 articles)
   ============================================================ */

// Aiguille le clic du bouton "Ajouter" selon qu'une formule à paliers
// est active ou non (achat simple à l'unité).
function gererClicAjouter(produitId) {
  if (etat.produitCourant.formuleChoisie && etat.produitCourant.formuleChoisie !== 'unitaire') {
    ajouterPackAuPanier(produitId);
  } else {
    ajouterAuPanier(produitId);
  }
}

// "Acheter maintenant" : commande UNIQUEMENT l'article (ou le pack) affiché
// à l'écran, avec la couleur et la taille choisies à cet instant.
// Il n'est PAS mis dans le panier : avant, il y était ajouté, donc si la
// cliente revenait en arrière et changeait de couleur, l'ancienne couleur
// restait dans le panier et se retrouvait aussi dans la commande.
// Le panier (bouton "Ajouter au panier") reste intact et séparé.
function acheterMaintenant(produitId) {
  const lignes = [];
  const place = (etat.produitCourant.formuleChoisie && etat.produitCourant.formuleChoisie !== 'unitaire')
    ? placerPackDans(lignes, produitId)
    : placerArticleDans(lignes, produitId);
  if (!place || lignes.length === 0) return;

  suivi.ajoutPanier(produitId);
  etat.achatDirect = lignes; // lu par la page de commande à la place du panier
  naviguerVers('commande');
}

// Bouton « Continuer mes achats » (page panier et page de commande) :
// ramène à l'accueil de la boutique sans rien perdre.
// - Le panier reste tel quel.
// - Ce qui a été tapé dans le formulaire est gardé (etat.brouillonCommande).
// - Si la cliente venait de « Acheter maintenant », l'article choisi est
//   mis dans le panier, pour qu'il ne disparaisse pas.
function continuerMesAchats() {
  if (etat.achatDirect && etat.achatDirect.length > 0) {
    verserAchatDirectDansPanier();
    afficherToast('Article gardé dans votre panier');
  }
  naviguerVers('accueil');
}

// Met l'article de « Acheter maintenant » dans le panier, puis oublie
// l'achat direct (utilisé par « Continuer mes achats » et quand la cliente
// ouvre son panier depuis la page de commande).
function verserAchatDirectDansPanier() {
  if (!etat.achatDirect) return;
  for (const ligne of etat.achatDirect) {
    // Un article simple déjà présent dans le panier : on augmente sa quantité
    // (sans dépasser le stock). Les articles d'un pack restent des lignes à part.
    const ligneExistante = !ligne.packId
      ? etat.panier.find(l => l.productId === ligne.productId && l.variantId === ligne.variantId && !l.packId)
      : null;
    if (ligneExistante) {
      ligneExistante.qty = Math.min(ligneExistante.qty + ligne.qty, plafond(ligne.stockDispo) || MAX_PAR_ARTICLE);
    } else {
      etat.panier.push({ ...ligne });
    }
  }
  etat.achatDirect = null;
  mettreAJourCompteurPanier();
  sauvegarderPanier();
}

// Lignes à commander sur la page de commande.
// - Sans achat direct : le contenu du panier.
// - Avec « Acheter maintenant » : l'article choisi PLUS tout le panier
//   (choix d'Oussama, V2.14 : sinon la cliente croit que son panier est
//   compris et ne reçoit qu'un article). Le panier lui-même n'est pas
//   modifié tant que la commande n'est pas envoyée.
function lignesACommander() {
  if (!etat.achatDirect) return etat.panier;
  const lignes = etat.panier.map(l => ({ ...l })); // copie : le panier reste intact
  for (const ligne of etat.achatDirect) {
    // Même article simple (même couleur et taille) déjà dans le panier :
    // une seule ligne, quantités additionnées (sans dépasser le stock).
    const ligneExistante = !ligne.packId
      ? lignes.find(l => l.productId === ligne.productId && l.variantId === ligne.variantId && !l.packId)
      : null;
    if (ligneExistante) {
      ligneExistante.qty = Math.min(ligneExistante.qty + ligne.qty, plafond(ligne.stockDispo) || MAX_PAR_ARTICLE);
    } else {
      lignes.push({ ...ligne });
    }
  }
  return lignes;
}

function choisirFormule(cle, qte) {
  etat.produitCourant.formuleChoisie = cle;
  etat.produitCourant.couleurChoisie = null;
  etat.produitCourant.tailleChoisie = null;

  document.querySelectorAll('.tuile-formule').forEach(el => el.classList.remove('selectionnee'));
  document.getElementById('formule-' + cle).classList.add('selectionnee');

  const zoneSimple = document.getElementById('zone-selection-simple');
  const zonePack = document.getElementById('unites-pack');
  const bouton = document.getElementById('bouton-ajouter');
  const boutonAchat = document.getElementById('bouton-acheter-maintenant');

  if (cle === 'unitaire') {
    zoneSimple.style.display = '';
    zonePack.innerHTML = '';
    bouton.disabled = true;
    bouton.textContent = 'Choisir une couleur';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }

  // Formule à plusieurs articles : masque le sélecteur simple, affiche
  // un mini sélecteur couleur/taille par article du pack.
  zoneSimple.style.display = 'none';
  const produit = trouverProduit(etat.parametresVue.produitId);
  const couleurs = [...new Set((produit.variants || []).map(v => v.color))];

  etat.produitCourant.selectionsPack = new Array(qte).fill(null);

  zonePack.innerHTML = Array.from({ length: qte }).map((_, i) => `
    <div class="unite-pack">
      <div class="titre-unite">Article ${i + 1}</div>
      <div class="options-couleur" id="options-couleur-pack-${i}">
        ${couleurs.map(c => {
          const v = (produit.variants || []).find(v => v.color === c);
          const photoSwatch = photosVariante(v)[0];
          return `
            <button type="button" class="swatch-couleur" data-couleur="${echapper(c)}" title="${echapper(c)}" onclick="choisirCouleurPack(${i}, ${enJs(c)})">
              ${photoSwatch ? `<img src="${echapper(photoOptimisee(photoSwatch, 100))}" alt="${echapper(c)}">` : ''}
            </button>`;
        }).join('')}
      </div>
      <select id="select-taille-pack-${i}" class="select-taille-pack" onchange="choisirTaillePack(${i}, this.value)" disabled>
        <option value="">Taille…</option>
      </select>
    </div>
  `).join('');

  bouton.disabled = true;
  if (boutonAchat) boutonAchat.disabled = true;
  bouton.textContent = 'Choisir chaque article du pack';
}

function choisirCouleurPack(index, couleur) {
  const produit = trouverProduit(etat.parametresVue.produitId);
  etat.produitCourant.selectionsPack[index] = { color: couleur, size: null };

  // Met en évidence la pastille choisie pour cet article du pack
  const conteneur = document.getElementById('options-couleur-pack-' + index);
  conteneur.querySelectorAll('.swatch-couleur').forEach(el => {
    el.classList.toggle('selectionne', el.dataset.couleur === couleur);
  });

  // Met aussi à jour la grande photo + la galerie, pour montrer la couleur choisie
  const varianteCouleur = (produit.variants || []).find(v => v.color === couleur && ((v.photos && v.photos.length) || v.photo));
  const photos = photosVariante(varianteCouleur);
  if (photos.length) {
    document.getElementById('photo-produit-principale').src = photoOptimisee(photos[0], 800);
  }
  const conteneurGalerie = document.getElementById('galerie-miniatures');
  if (conteneurGalerie) {
    conteneurGalerie.innerHTML = photos.length > 1
      ? photos.map((url, i) => `
          <button type="button" class="miniature-photo ${i === 0 ? 'selectionnee' : ''}" onclick="selectionnerPhoto(${enJs(url)}, this)">
            <img src="${echapper(photoOptimisee(url, 120))}" alt="${echapper(couleur)}">
          </button>
        `).join('')
      : '';
  }

  const selectTaille = document.getElementById('select-taille-pack-' + index);
  const taillesDispo = (produit.variants || []).filter(v => v.color === couleur && Number(v.qty) > 0);
  selectTaille.innerHTML = `<option value="">Taille…</option>` +
    taillesDispo.map(v => `<option value="${echapper(v.size)}">${echapper(v.size)}</option>`).join('');
  selectTaille.disabled = !couleur;
  actualiserBoutonPack();
}

function choisirTaillePack(index, taille) {
  etat.produitCourant.selectionsPack[index].size = taille;
  actualiserBoutonPack();
}

function actualiserBoutonPack() {
  const bouton = document.getElementById('bouton-ajouter');
  const boutonAchat = document.getElementById('bouton-acheter-maintenant');
  const selections = etat.produitCourant.selectionsPack || [];
  const complet = selections.length > 0 && selections.every(s => s && s.color && s.size);
  bouton.disabled = !complet;
  bouton.textContent = complet ? 'Ajouter le pack au panier' : 'Choisir chaque article du pack';
  if (boutonAchat) boutonAchat.disabled = !complet;
}

// Place les articles du pack choisi dans la liste "lignes" (panier ou
// achat direct). Renvoie true si le pack a bien été placé.
function placerPackDans(lignes, produitId) {
  const produit = trouverProduit(produitId);
  const palier = produit.promoPaliers[etat.produitCourant.formuleChoisie];
  const selections = etat.produitCourant.selectionsPack || [];
  if (!palier || selections.some(s => !s || !s.color || !s.size)) return false;

  const prixUnitairePack = Number(palier.prixTotal) / palier.qte;
  const idPack = 'pack-' + Date.now();

  for (const selection of selections) {
    const variante = (produit.variants || []).find(v => v.color === selection.color && v.size === selection.size);
    if (!variante || Number(variante.qty) <= 0) continue;

    const ligneExistante = lignes.find(l => l.productId === produitId && l.variantId === variante.id && !l.packId);
    if (ligneExistante) {
      ligneExistante.qty = Math.min(ligneExistante.qty + 1, plafond(variante.qty));
    } else {
      lignes.push({
        productId: produitId,
        variantId: variante.id,
        name: produit.name,
        cat: produit.cat,
        price: prixUnitairePack,
        size: variante.size,
        color: variante.color,
        photo: photosVariante(variante)[0] || photoParDefaut(produit),
        qty: 1,
        stockDispo: plafond(variante.qty),
        packId: idPack,
        packLabel: `Pack ${palier.qte} articles`
      });
    }
  }
  return true;
}

function ajouterPackAuPanier(produitId) {
  if (!placerPackDans(etat.panier, produitId)) return;

  mettreAJourCompteurPanier();
  sauvegarderPanier();
  suivi.ajoutPanier(produitId);
  afficherToast('Pack ajouté au panier');
}

/* ============================================================
   VUE — PANIER
   ============================================================ */
function vuePanier() {
  if (etat.panier.length === 0) {
    return `
      <div class="panier-vide">
        <h2 class="titre-serif" style="font-size:1.4rem; margin-bottom:14px;">Votre panier est vide</h2>
        <button class="bouton-principal" onclick="naviguerVers('catalogue', {categorie: '${CATEGORIES_PRINCIPALES[0]}'})">Voir la collection</button>
      </div>
    `;
  }

  const sousTotal = etat.panier.reduce((s, l) => s + l.qty * Number(l.price), 0);
  const frais = fraisLivraison();
  const total = sousTotal + frais;

  return `
    <div class="section-etroite" style="margin-top:30px;">
      <h1 style="font-size:1.6rem; margin-bottom:6px;">Votre panier</h1>
      <div>
        ${etat.panier.map((ligne, index) => `
          <div class="ligne-panier">
            ${urlSure(ligne.photo) ? `<img src="${echapper(photoOptimisee(ligne.photo, 120))}" alt="${echapper(ligne.name)}">` : ''}
            <div class="infos-ligne">
              <div class="nom">${echapper(ligne.name)}</div>
              <div class="variante">${echapper(ligne.color)} · ${echapper(ligne.size)}${ligne.packLabel ? ` · <span style="color:var(--dore);">${echapper(ligne.packLabel)}</span>` : ''}</div>
              <div class="bas-ligne">
                <div class="qte-panier">
                  <button type="button" onclick="modifierQteLignePanier(${index}, -1)">−</button>
                  <span>${ligne.qty}</span>
                  <button type="button" onclick="modifierQteLignePanier(${index}, 1)">+</button>
                </div>
                <div class="prix-ligne">${prixFormat(ligne.qty * ligne.price)}</div>
              </div>
              <button type="button" class="bouton-supprimer" onclick="retirerDuPanier(${index})">Retirer</button>
            </div>
          </div>
        `).join('')}

  // (voir etat.brouillonCommande).

    // Téléphone : on ne garde que les chiffres, 8 au maximum (V2.22).
    if (champ && champ.id === 'champ-telephone') {
      champ.value = champ.value.replace(/[^0-9]/g, '').slice(0, 8);
    }

    }
  };
  formulaire.addEventListener('input', garderChamp);
  formulaire.addEventListener('change', garderChamp); // liste « Gouvernorat » (V2.35)
  formulaire.addEventListener('submit', (evenement) => {
    evenement.preventDefault();

/* ============================================================
   V5.7 : TURNSTILE — ANTI-ROBOT GRATUIT DE CLOUDFLARE
   Remplace reCAPTCHA pour les commandes. Invisible pour la cliente
   (une case à cocher n'apparaît que si Cloudflare a un doute).
   La clé PUBLIQUE est donnée par le Worker (/api/config) : tant
   qu'elle n'est pas installée dans Cloudflare, rien n'est affiché
   et la commande part sans jeton (le Worker ne vérifie pas non plus).
   Chaque jeton ne sert qu'une seule fois.
   ============================================================ */
const turnstileEtat = { cle: undefined, script: null, widget: null, jeton: '', enAttente: [] };

function chargerCleTurnstile() {
  if (turnstileEtat.cle !== undefined) return Promise.resolve(turnstileEtat.cle);
  return fetch('/api/config')
    .then(r => r.json())
    .then(d => { turnstileEtat.cle = d && typeof d.turnstile === 'string' && d.turnstile ? d.turnstile : null; return turnstileEtat.cle; })
    .catch(() => null); // réseau coupé : on réessaiera à la prochaine ouverture du formulaire
}

function chargerScriptTurnstile() {
  if (!turnstileEtat.script) {
    turnstileEtat.script = new Promise((ok, ko) => {
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.async = true;
      s.onload = () => ok();
      s.onerror = () => { turnstileEtat.script = null; ko(new Error('Turnstile indisponible')); };
      document.head.appendChild(s);
    });
  }
  return turnstileEtat.script;
}

function preparerTurnstile() {
  chargerCleTurnstile().then(cle => {
    if (!cle) return;
    return chargerScriptTurnstile().then(() => {
      const zone = document.getElementById('zone-turnstile');
      if (!zone || !window.turnstile || zone.childElementCount) return;
      turnstileEtat.jeton = '';
      turnstileEtat.widget = window.turnstile.render(zone, {
        sitekey: cle,
        appearance: 'interaction-only',
        callback: (jeton) => {
          turnstileEtat.jeton = jeton;
          turnstileEtat.enAttente.splice(0).forEach(f => f(jeton));
        },
        'expired-callback': () => { turnstileEtat.jeton = ''; },
        'error-callback': () => { turnstileEtat.jeton = ''; }
      });
    });
  }).catch(e => console.warn(e && e.message));
}

// Renvoie (promesse) le jeton à joindre à la commande : '' si Turnstile
// n'est pas installé ; null si la vérification n'a pas abouti à temps.
function obtenirJetonTurnstile() {
  return chargerCleTurnstile().then(cle => {
    if (!cle) return '';
    if (turnstileEtat.jeton) return turnstileEtat.jeton;
    return new Promise(ok => {
      turnstileEtat.enAttente.push(ok);
      setTimeout(() => ok(turnstileEtat.jeton || null), 20000);
    });
  });
}

// Après un envoi (réussi ou non), le jeton est usé : on en redemande un.
function relancerTurnstile() {
  turnstileEtat.jeton = '';
  try { if (window.turnstile && turnstileEtat.widget !== null) window.turnstile.reset(turnstileEtat.widget); } catch (e) {}
}

// Compare les quantités demandées (regroupées par article + variante)
// au stock disponible actuel du catalogue. Renvoie la liste des
// variantes dont il ne reste pas assez : [{ libelle, reste }].
function articlesEpuises(lignes) {
  const demandes = new Map();
  for (const l of lignes) {
    const cle = l.productId + '|' + l.variantId;
    const deja = demandes.get(cle);
    if (deja) deja.qty += Number(l.qty) || 0;
    else demandes.set(cle, { ligne: l, qty: Number(l.qty) || 0 });
  }
  const manquants = [];
  for (const { ligne, qty } of demandes.values()) {
    const produit = trouverProduit(ligne.productId);
    const variante = produit ? (produit.variants || []).find(v => v.id === ligne.variantId) : null;
    const reste = variante ? Math.max(0, Number(variante.qty) || 0) : 0;
    if (qty > reste) {
      const details = [ligne.color, ligne.size].filter(Boolean).join(', ');
      manquants.push({ libelle: (ligne.name || 'Article') + (details ? ` (${details})` : ''), reste });
    }
  }
  return manquants;
}

function envoyerCommande() {
  const boutonValider = document.getElementById('bouton-valider-commande');
  const bandeauErreur = document.getElementById('bandeau-erreur-commande');
  bandeauErreur.innerHTML = '';

  const clientName = document.getElementById('champ-nom').value.trim();
  // Téléphone : on retire espaces et tirets, il doit rester exactement 8 chiffres (V2.22).
  const phone = document.getElementById('champ-telephone').value.replace(/[^0-9]/g, '');
  const address = document.getElementById('champ-adresse').value.trim();
  const remark = document.getElementById('champ-remarque').value.trim();
  const gouvernorat = document.getElementById('champ-gouvernorat').value;
  const ville = document.getElementById('champ-ville').value.trim();

  if (!clientName || !phone || !address || !ville) {
    bandeauErreur.innerHTML = `<div class="bandeau-erreur">Merci de remplir tous les champs obligatoires.</div>`;
    return;
  }
  if (!/^[0-9]{8}$/.test(phone)) {
    bandeauErreur.innerHTML = `<div class="bandeau-erreur">Le numéro de téléphone doit contenir exactement 8 chiffres.</div>`;
    document.getElementById('champ-telephone').focus();
    return;
  }
  // V2.35 : gouvernorat obligatoire (la société de livraison en a besoin).
  if (!nomGouvernorat(gouvernorat)) {
    bandeauErreur.innerHTML = `<div class="bandeau-erreur">Merci de choisir votre gouvernorat.</div>`;
    document.getElementById('champ-gouvernorat').focus();
    return;
  }
  const lignes = lignesACommander();
  if (lignes.length === 0) {
    bandeauErreur.innerHTML = `<div class="bandeau-erreur">Votre panier est vide.</div>`;
    return;
  }
  // V2.23 : dernière vérification du stock juste avant l'envoi
  // (le catalogue est tenu à jour en direct, une autre cliente a pu
  // prendre la dernière pièce pendant que celle-ci remplissait le formulaire).
  const manquants = articlesEpuises(lignes);
  if (manquants.length) {
    afficherStockChange(bandeauErreur, manquants);
    return;
  }

  boutonValider.disabled = true;
  boutonValider.textContent = 'Envoi en cours…';

  // Construit le document au format exact attendu par les règles Firestore
  // V2.29 : 3 chiffres au hasard à la fin, pour que deux clientes qui
  // commandent à la même milliseconde n'aient pas la même référence.
  const numeroCommande = 'WEB-' + Date.now() + String(Math.floor(Math.random() * 1000)).padStart(3, '0');
  const nouveauColis = {
    ref: numeroCommande,
    courier: '',
    clientName: clientName,
    phone: phone,
    // V2.35 : la ville est écrite au début de l'adresse (Bestway n'a pas de champ « ville »).
    address: (ville + ', ' + address).slice(0, 500),
    remark: remark,
    status: 'transit',
    confirmed: false,
    items: lignes.map(l => ({
      productId: l.productId,
      variantId: l.variantId,
      qty: Math.round(Number(l.qty)) || 1
    })),
    deliveryFee: (typeof etat.fraisAffiches === 'number') ? etat.fraisAffiches : fraisLivraison(), // frais affichés à la cliente sur la page de commande (nombre)
    date: new Date().toISOString()
  };

  // Commande réussie : on vide le panier et on affiche la confirmation.
  const reussite = () => {
    etat.dernierNumeroCommande = numeroCommande;
    etat.brouillonCommande = { clientName: '', phone: '', address: '', remark: '', gouvernorat: '', ville: '' };
    // Tout a été commandé (panier + éventuel achat direct) : on vide les deux
    etat.achatDirect = null;
    etat.panier = [];
    sauvegarderPanier();
    mettreAJourCompteurPanier();
    naviguerVers('confirmation');
  };
  const echec = (erreur) => {
    console.error('Erreur lors de la création de la commande :', erreur);
    // V5.8 : petit code à la fin du message (ex. « code 503 ») pour savoir
    // d'où vient le problème quand une cliente envoie une capture.
    const code = (erreur && erreur.codeServeur) ? ` (code ${Number(erreur.codeServeur)})` : '';
    bandeauErreur.innerHTML = `<div class="bandeau-erreur">Une erreur est survenue lors de l'envoi de votre commande. Merci de réessayer.${code}</div>`;
    boutonValider.disabled = false;
    boutonValider.textContent = 'Confirmer la commande';
  };
  // V5.8 : SECOURS remis en place. Si le Worker ne peut pas enregistrer la
  // commande (clé Firebase absente ou refusée : 503 ; adresse inconnue :
  // 404/405 ; panne : 500), la page enregistre le colis elle-même, comme
  // avant la V5.7, pour ne jamais bloquer les ventes. À retirer seulement
  // quand le Worker aura enregistré de vraies commandes sans erreur.
  const envoiDirect = (codeServeur) => db.collection('shipments')
    .add({ ...nouveauColis, address: (nomGouvernorat(gouvernorat) + ' — ' + nouveauColis.address).slice(0, 500) })
    .then(reussite)
    .catch((e) => echec({ codeServeur, cause: e }));

  // V2.24 : la commande passe par le Worker Cloudflare (/api/commande), qui
  // vérifie le stock et crée le colis en une seule opération, 24 h/24.
  // V5.7 : chemin principal (V5.8 : secours direct si le Worker échoue), et
  // il est protégé par Turnstile (jeton joint à la commande).
  obtenirJetonTurnstile()
    .then((jetonTurnstile) => {
      if (jetonTurnstile === null) {
        relancerTurnstile();
        throw new Error('turnstile-delai');
      }
      return fetch('/api/commande', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...nouveauColis, gouvernorat, turnstile: jetonTurnstile }) // V2.35 : le Worker ajoute le gouvernorat au colis
      });
    })
    .then(async (reponse) => {
      relancerTurnstile(); // jeton usé
      const donnees = await reponse.json().catch(() => ({}));
      if (reponse.ok && donnees.ok) return reussite();
      if (reponse.status === 409 && Array.isArray(donnees.manquants)) {
        // Stock insuffisant au moment exact de l'envoi
        boutonValider.disabled = false;
        boutonValider.textContent = 'Confirmer la commande';
        afficherStockChange(bandeauErreur, donnees.manquants.map(m => {
          const ligne = lignes.find(l => l.productId === m.productId && l.variantId === m.variantId) || {};
          const details = [ligne.color, ligne.size].filter(Boolean).join(', ');
          return { libelle: (ligne.name || 'Article') + (details ? ` (${details})` : ''), reste: Number(m.reste) || 0 };
        }));
        return;
      }
      if (reponse.status === 403 && donnees.erreur === 'turnstile') {
        // V5.7 : la vérification anti-robot n'a pas abouti
        bandeauErreur.innerHTML = `<div class="bandeau-erreur">La vérification de sécurité n'a pas abouti. Merci de réessayer.</div>`;
        boutonValider.disabled = false;
        boutonValider.textContent = 'Confirmer la commande';
        return;
      }
      if (reponse.status === 429) {
        // V2.29 : trop de commandes envoyées en peu de temps depuis la même connexion
        bandeauErreur.innerHTML = `<div class="bandeau-erreur">Beaucoup de commandes viennent d'être envoyées depuis votre connexion. Merci de patienter une minute puis de réessayer.</div>`;
        boutonValider.disabled = false;
        boutonValider.textContent = 'Confirmer la commande';
        return;
      }
      if ([503, 404, 405, 500].includes(reponse.status)) {
        console.warn('Worker indisponible (' + reponse.status + ', ' + (donnees.erreur || '?') + ') : envoi direct.');
        return envoiDirect(reponse.status);
      }
      echec({ codeServeur: reponse.status });
    })
    .catch(echec);
}

// Message rouge « le stock vient de changer » (V2.23, réutilisé en V2.24).
function afficherStockChange(bandeauErreur, manquants) {
  bandeauErreur.innerHTML = `<div class="bandeau-erreur">
    Désolé, ce stock vient de changer :<br>

  </div>`;
}

  const lignes = [];
  const email = String(c.email || '').trim();
  if (email) lignes.push(`<div class="item-contact">${icones.email}<a href="mailto:${echapper(email)}">${echapper(email)}</a></div>`);
  const tel = String(c.phone || '').trim();
  if (tel) lignes.push(`<div class="item-contact">${icones.phone}<a href="tel:${echapper(tel.replace(/[^+0-9]/g, ''))}">${echapper(tel)}</a></div>`);
  const whatsapp = String(c.whatsapp || '').replace(/[^0-9]/g, '');
  if (whatsapp) lignes.push(`<div class="item-contact">${icones.whatsapp}<a href="https://wa.me/${whatsapp}" target="_blank" rel="noopener">WhatsApp</a></div>`);
  const adresse = String(c.address || '').trim();
  if (adresse) lignes.push(`<div class="item-contact">${icones.address}<span>${echapper(adresse)}</span></div>`);
  const reseaux = [];
  [['Instagram', c.instagramUrl, icones.lien], ['Facebook', c.facebookUrl, icones.facebook], ['TikTok', c.tiktokUrl, icones.tiktok]].forEach(([libelle, url, icone]) => {
    const u = urlSure(url, '');
    if (u) reseaux.push(`<div class="item-contact">${icone}<a href="${echapper(u)}" target="_blank" rel="noopener">${libelle}</a></div>`);
  });
  if (quoi === 'contact') return lignes;
  if (quoi === 'reseaux') return reseaux;
  return lignes.concat(reseaux);
}

   (rechargement, retour plus tard, lien partagé), sinon accueil
   ============================================================ */
{
  const { vue, parametres } = analyserHash();
  appliquerNavigation(vue, parametres);
  suivi.visite();
}
