function initialiserFicheProduit(produitId) {
  // Rien à faire ici pour l'instant : les interactions passent par les
  // fonctions choisirCouleur / choisirTaille / changerQuantite ci-dessous.
}

function choisirCouleur(produitId, couleur) {
  const produit = trouverProduit(produitId);
  etat.produitCourant.couleurChoisie = couleur;
  etat.produitCourant.tailleChoisie = null;
  etat.produitCourant.quantiteChoisie = 1;

  // Met à jour visuellement le swatch sélectionné
  document.querySelectorAll('.swatch-couleur').forEach(el => {
    el.classList.toggle('selectionne', el.dataset.couleur === couleur);
  });

  // Affiche le nom de la couleur choisie à côté du mot « Couleur »
  // (ex. « Couleur : Jaune »). Le nom est échappé avant d'être inséré.
  const nomCouleur = document.getElementById('nom-couleur-choisie');
  if (nomCouleur) {
    nomCouleur.innerHTML = couleur ? ' : ' + echapper(couleur) : '';
  }

  // Met à jour la photo principale + la galerie de miniatures pour cette couleur
  const varianteCouleur = (produit.variants || []).find(v => v.color === couleur && ((v.photos && v.photos.length) || v.photo));
  const photos = photosVariante(varianteCouleur);
  if (photos.length) {
    document.getElementById('photo-produit-principale').src = photos[0];
  }
  const conteneurGalerie = document.getElementById('galerie-miniatures');
  if (photos.length > 1) {
    conteneurGalerie.innerHTML = photos.map((url, i) => `
      <button type="button" class="miniature-photo ${i === 0 ? 'selectionnee' : ''}" onclick="selectionnerPhoto('${url}', this)">
        <img src="${url}" alt="${produit.name}">
      </button>
    `).join('');
  } else {
    conteneurGalerie.innerHTML = '';
  }

  // Construit les tailles disponibles pour cette couleur
  const taillesPourCouleur = (produit.variants || []).filter(v => v.color === couleur);
  const conteneurTailles = document.getElementById('options-taille');
  conteneurTailles.innerHTML = taillesPourCouleur.map(v => `
    <button type="button" class="bouton-taille" data-taille="${v.size}"
      ${Number(v.qty) <= 0 ? 'disabled' : ''}
      onclick="choisirTaille('${produitId}', '${v.color}', '${v.size}')">
      ${v.size}
    </button>
  `).join('');

  document.getElementById('stock-info').textContent = '';
  actualiserBoutonAjouter(produitId);
}

function selectionnerPhoto(url, boutonClique) {
  document.getElementById('photo-produit-principale').src = url;
  document.querySelectorAll('.miniature-photo').forEach(el => el.classList.remove('selectionnee'));
  boutonClique.classList.add('selectionnee');
}

function choisirTaille(produitId, couleur, taille) {
  etat.produitCourant.tailleChoisie = taille;
  etat.produitCourant.quantiteChoisie = 1;
  document.getElementById('quantite-choisie').textContent = '1';

  document.querySelectorAll('.bouton-taille').forEach(el => {
    el.classList.toggle('selectionne', el.dataset.taille === taille);
  });

  const produit = trouverProduit(produitId);
  const variante = (produit.variants || []).find(v => v.color === couleur && v.size === taille);
  const infoStock = document.getElementById('stock-info');
  if (variante) {
    if (variante.qty <= 3) {
      infoStock.textContent = `Plus que ${variante.qty} en stock`;
      infoStock.classList.add('faible');
    } else {
      infoStock.textContent = `En stock`;
      infoStock.classList.remove('faible');
    }
  }
  actualiserBoutonAjouter(produitId);
}

function changerQuantite(delta) {
  const produit = trouverProduit(etat.parametresVue.produitId);
  const variante = varianteChoisie(produit);
  const max = variante ? Number(variante.qty) : 1;
  let nouvelle = etat.produitCourant.quantiteChoisie + delta;
  nouvelle = Math.max(1, Math.min(nouvelle, max || 1));
  etat.produitCourant.quantiteChoisie = nouvelle;
  document.getElementById('quantite-choisie').textContent = nouvelle;
}

function varianteChoisie(produit) {
  if (!produit || !etat.produitCourant.couleurChoisie || !etat.produitCourant.tailleChoisie) return null;
  return (produit.variants || []).find(v =>
    v.color === etat.produitCourant.couleurChoisie && v.size === etat.produitCourant.tailleChoisie
  );
}

function actualiserBoutonAjouter(produitId) {
  const produit = trouverProduit(produitId);
  const variante = varianteChoisie(produit);
  const bouton = document.getElementById('bouton-ajouter');
  const boutonAchat = document.getElementById('bouton-acheter-maintenant');
  if (!etat.produitCourant.couleurChoisie) {
    bouton.disabled = true; bouton.textContent = 'Choisir une couleur';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }
  if (!variante) {
    bouton.disabled = true; bouton.textContent = 'Choisir une taille';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }
  if (Number(variante.qty) <= 0) {
    bouton.disabled = true; bouton.textContent = 'Épuisé dans cette taille';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }
  bouton.disabled = false; bouton.textContent = 'Ajouter au panier';
  if (boutonAchat) boutonAchat.disabled = false;
}

// Place l'article choisi (couleur + taille + quantité) dans la liste "lignes".
// "lignes" est soit le panier, soit la liste d'un achat direct (bouton
// "Acheter maintenant"). Renvoie true si l'article a bien été placé.
function placerArticleDans(lignes, produitId) {
  const produit = trouverProduit(produitId);
  const variante = varianteChoisie(produit);
  if (!produit || !variante) return false;

  const { actuel } = prixUnitaireEffectif(produit);
  const ligneExistante = lignes.find(l => l.productId === produitId && l.variantId === variante.id && !l.packId);
  const quantiteDemandee = etat.produitCourant.quantiteChoisie;

  if (ligneExistante) {
    ligneExistante.qty = Math.min(ligneExistante.qty + quantiteDemandee, Number(variante.qty));
  } else {
    lignes.push({
      productId: produitId,
      variantId: variante.id,
      name: produit.name,
      cat: produit.cat,
      price: actuel,
      size: variante.size,
      color: variante.color,
      photo: photosVariante(variante)[0] || photoParDefaut(produit),
      qty: quantiteDemandee,
      stockDispo: Number(variante.qty)
    });
  }
  return true;
}

function ajouterAuPanier(produitId) {
  if (!placerArticleDans(etat.panier, produitId)) return;

  mettreAJourCompteurPanier();
  sauvegarderPanier();
  suivi.ajoutPanier(produitId);
  afficherToast('Article ajouté au panier');
}

/* ============================================================
   FORMULES / PALIERS DE QUANTITÉ (ex : 1 / 2 / 3 articles)
   ============================================================ */

// Aiguille le clic du bouton "Ajouter" selon qu'une formule à paliers
// est active ou non (achat simple à l'unité).
function gererClicAjouter(produitId) {
  if (etat.produitCourant.formuleChoisie && etat.produitCourant.formuleChoisie !== 'unitaire') {
    ajouterPackAuPanier(produitId);
  } else {
    ajouterAuPanier(produitId);
  }
}

// "Acheter maintenant" : commande UNIQUEMENT l'article (ou le pack) affiché
// à l'écran, avec la couleur et la taille choisies à cet instant.
// Il n'est PAS mis dans le panier : avant, il y était ajouté, donc si la
// cliente revenait en arrière et changeait de couleur, l'ancienne couleur
// restait dans le panier et se retrouvait aussi dans la commande.
// Le panier (bouton "Ajouter au panier") reste intact et séparé.
function acheterMaintenant(produitId) {
  const lignes = [];
  const place = (etat.produitCourant.formuleChoisie && etat.produitCourant.formuleChoisie !== 'unitaire')
    ? placerPackDans(lignes, produitId)
    : placerArticleDans(lignes, produitId);
  if (!place || lignes.length === 0) return;

  suivi.ajoutPanier(produitId);
  etat.achatDirect = lignes; // lu par la page de commande à la place du panier
  naviguerVers('commande');
}

// Bouton « Continuer mes achats » (page panier et page de commande) :
// ramène à l'accueil de la boutique sans rien perdre.
// - Le panier reste tel quel.
// - Ce qui a été tapé dans le formulaire est gardé (etat.brouillonCommande).
// - Si la cliente venait de « Acheter maintenant », l'article choisi est
//   mis dans le panier, pour qu'il ne disparaisse pas.
function continuerMesAchats() {
  if (etat.achatDirect && etat.achatDirect.length > 0) {
    verserAchatDirectDansPanier();
    afficherToast('Article gardé dans votre panier');
  }
  naviguerVers('accueil');
}

// Met l'article de « Acheter maintenant » dans le panier, puis oublie
// l'achat direct (utilisé par « Continuer mes achats » et quand la cliente
// ouvre son panier depuis la page de commande).
function verserAchatDirectDansPanier() {
  if (!etat.achatDirect) return;
  for (const ligne of etat.achatDirect) {
    // Un article simple déjà présent dans le panier : on augmente sa quantité
    // (sans dépasser le stock). Les articles d'un pack restent des lignes à part.
    const ligneExistante = !ligne.packId
      ? etat.panier.find(l => l.productId === ligne.productId && l.variantId === ligne.variantId && !l.packId)
      : null;
    if (ligneExistante) {
      ligneExistante.qty = Math.min(ligneExistante.qty + ligne.qty, Number(ligne.stockDispo) || ligneExistante.qty + ligne.qty);
    } else {
      etat.panier.push({ ...ligne });
    }
  }
  etat.achatDirect = null;
  mettreAJourCompteurPanier();
  sauvegarderPanier();
}

// Lignes à commander sur la page de commande.
// - Sans achat direct : le contenu du panier.
// - Avec « Acheter maintenant » : l'article choisi PLUS tout le panier
//   (choix d'Oussama, V2.14 : sinon la cliente croit que son panier est
//   compris et ne reçoit qu'un article). Le panier lui-même n'est pas
//   modifié tant que la commande n'est pas envoyée.
function lignesACommander() {
  if (!etat.achatDirect) return etat.panier;
  const lignes = etat.panier.map(l => ({ ...l })); // copie : le panier reste intact
  for (const ligne of etat.achatDirect) {
    // Même article simple (même couleur et taille) déjà dans le panier :
    // une seule ligne, quantités additionnées (sans dépasser le stock).
    const ligneExistante = !ligne.packId
      ? lignes.find(l => l.productId === ligne.productId && l.variantId === ligne.variantId && !l.packId)
      : null;
    if (ligneExistante) {
      ligneExistante.qty = Math.min(ligneExistante.qty + ligne.qty, Number(ligne.stockDispo) || ligneExistante.qty + ligne.qty);
    } else {
      lignes.push({ ...ligne });
    }
  }
  return lignes;
}

function choisirFormule(cle, qte) {
  etat.produitCourant.formuleChoisie = cle;
  etat.produitCourant.couleurChoisie = null;
  etat.produitCourant.tailleChoisie = null;

  document.querySelectorAll('.tuile-formule').forEach(el => el.classList.remove('selectionnee'));
  document.getElementById('formule-' + cle).classList.add('selectionnee');

  const zoneSimple = document.getElementById('zone-selection-simple');
  const zonePack = document.getElementById('unites-pack');
  const bouton = document.getElementById('bouton-ajouter');
  const boutonAchat = document.getElementById('bouton-acheter-maintenant');

  if (cle === 'unitaire') {
    zoneSimple.style.display = '';
    zonePack.innerHTML = '';
    bouton.disabled = true;
    bouton.textContent = 'Choisir une couleur';
    if (boutonAchat) boutonAchat.disabled = true;
    return;
  }

  // Formule à plusieurs articles : masque le sélecteur simple, affiche
  // un mini sélecteur couleur/taille par article du pack.
  zoneSimple.style.display = 'none';
  const produit = trouverProduit(etat.parametresVue.produitId);
  const couleurs = [...new Set((produit.variants || []).map(v => v.color))];

  etat.produitCourant.selectionsPack = new Array(qte).fill(null);

  zonePack.innerHTML = Array.from({ length: qte }).map((_, i) => `
    <div class="unite-pack">
      <div class="titre-unite">Article ${i + 1}</div>
      <div class="options-couleur" id="options-couleur-pack-${i}">
        ${couleurs.map(c => {
          const v = (produit.variants || []).find(v => v.color === c);
          const photoSwatch = photosVariante(v)[0];
          return `
            <button type="button" class="swatch-couleur" data-couleur="${c}" title="${c}" onclick="choisirCouleurPack(${i}, '${c}')">
              ${photoSwatch ? `<img src="${photoSwatch}" alt="${c}">` : ''}
            </button>`;
        }).join('')}
      </div>
      <select id="select-taille-pack-${i}" class="select-taille-pack" onchange="choisirTaillePack(${i}, this.value)" disabled>
        <option value="">Taille…</option>
      </select>
    </div>
  `).join('');

  bouton.disabled = true;
  if (boutonAchat) boutonAchat.disabled = true;
  bouton.textContent = 'Choisir chaque article du pack';
}

function choisirCouleurPack(index, couleur) {
  const produit = trouverProduit(etat.parametresVue.produitId);
  etat.produitCourant.selectionsPack[index] = { color: couleur, size: null };

  // Met en évidence la pastille choisie pour cet article du pack
  const conteneur = document.getElementById('options-couleur-pack-' + index);
  conteneur.querySelectorAll('.swatch-couleur').forEach(el => {
    el.classList.toggle('selectionne', el.dataset.couleur === couleur);
  });

  // Met aussi à jour la grande photo + la galerie, pour montrer la couleur choisie
  const varianteCouleur = (produit.variants || []).find(v => v.color === couleur && ((v.photos && v.photos.length) || v.photo));
  const photos = photosVariante(varianteCouleur);
  if (photos.length) {
    document.getElementById('photo-produit-principale').src = photos[0];
  }
  const conteneurGalerie = document.getElementById('galerie-miniatures');
  if (conteneurGalerie) {
    conteneurGalerie.innerHTML = photos.length > 1
      ? photos.map((url, i) => `
          <button type="button" class="miniature-photo ${i === 0 ? 'selectionnee' : ''}" onclick="selectionnerPhoto('${url}', this)">
            <img src="${url}" alt="${couleur}">
          </button>
        `).join('')
      : '';
  }

  const selectTaille = document.getElementById('select-taille-pack-' + index);
  const taillesDispo = (produit.variants || []).filter(v => v.color === couleur && Number(v.qty) > 0);
  selectTaille.innerHTML = `<option value="">Taille…</option>` +
    taillesDispo.map(v => `<option value="${v.size}">${v.size}</option>`).join('');
  selectTaille.disabled = !couleur;
  actualiserBoutonPack();
}

function choisirTaillePack(index, taille) {
  etat.produitCourant.selectionsPack[index].size = taille;
  actualiserBoutonPack();
}

function actualiserBoutonPack() {
  const bouton = document.getElementById('bouton-ajouter');
  const boutonAchat = document.getElementById('bouton-acheter-maintenant');
  const selections = etat.produitCourant.selectionsPack || [];
  const complet = selections.length > 0 && selections.every(s => s && s.color && s.size);
  bouton.disabled = !complet;
  bouton.textContent = complet ? 'Ajouter le pack au panier' : 'Choisir chaque article du pack';
  if (boutonAchat) boutonAchat.disabled = !complet;
}

// Place les articles du pack choisi dans la liste "lignes" (panier ou
// achat direct). Renvoie true si le pack a bien été placé.
function placerPackDans(lignes, produitId) {
  const produit = trouverProduit(produitId);
  const palier = produit.promoPaliers[etat.produitCourant.formuleChoisie];
  const selections = etat.produitCourant.selectionsPack || [];
  if (!palier || selections.some(s => !s || !s.color || !s.size)) return false;

  const prixUnitairePack = Number(palier.prixTotal) / palier.qte;
  const idPack = 'pack-' + Date.now();

  for (const selection of selections) {
    const variante = (produit.variants || []).find(v => v.color === selection.color && v.size === selection.size);
    if (!variante || Number(variante.qty) <= 0) continue;

    const ligneExistante = lignes.find(l => l.productId === produitId && l.variantId === variante.id && !l.packId);
    if (ligneExistante) {
      ligneExistante.qty = Math.min(ligneExistante.qty + 1, Number(variante.qty));
    } else {
      lignes.push({
        productId: produitId,
        variantId: variante.id,
        name: produit.name,
        cat: produit.cat,
        price: prixUnitairePack,
        size: variante.size,
        color: variante.color,
        photo: photosVariante(variante)[0] || photoParDefaut(produit),
        qty: 1,
        stockDispo: Number(variante.qty),
        packId: idPack,
        packLabel: `Pack ${palier.qte} articles`
      });
    }
  }
  return true;
}

function ajouterPackAuPanier(produitId) {
  if (!placerPackDans(etat.panier, produitId)) return;

  mettreAJourCompteurPanier();
  sauvegarderPanier();
  suivi.ajoutPanier(produitId);
  afficherToast('Pack ajouté au panier');
}

                </div>

              </div>
              <button type="button" class="bouton-supprimer" onclick="retirerDuPanier(${index})">Retirer</button>

      <button class="bouton-principal" style="width:100%;" onclick="naviguerVers('commande')">Passer la commande</button>

    </div>

function modifierQteLignePanier(index, delta) {
  const ligne = etat.panier[index];
  const nouvelle = ligne.qty + delta;
  if (nouvelle < 1) return;
  if (nouvelle > ligne.stockDispo) { afficherToast('Stock maximum atteint pour cet article'); return; }
  ligne.qty = nouvelle;
  sauvegarderPanier();
  rendre();
}

function retirerDuPanier(index) {
  etat.panier.splice(index, 1);
  sauvegarderPanier();
  rendre();
}

function initialiserFormulaireCommande() {
  const formulaire = document.getElementById('formulaire-commande');
  if (!formulaire) return;
  // À chaque lettre tapée, on garde le contenu des champs en mémoire
  // (voir etat.brouillonCommande).
  formulaire.addEventListener('input', (evenement) => {
    const champ = evenement.target;
    if (champ && champ.name && champ.name in etat.brouillonCommande) {
      etat.brouillonCommande[champ.name] = champ.value;
    }
  });
  formulaire.addEventListener('submit', (evenement) => {
    evenement.preventDefault();
    envoyerCommande();
  });
}

function envoyerCommande() {
  const boutonValider = document.getElementById('bouton-valider-commande');
  const bandeauErreur = document.getElementById('bandeau-erreur-commande');
  bandeauErreur.innerHTML = '';

  const clientName = document.getElementById('champ-nom').value.trim();
  const phone = document.getElementById('champ-telephone').value.trim();
  const address = document.getElementById('champ-adresse').value.trim();
  const remark = document.getElementById('champ-remarque').value.trim();

  if (!clientName || !phone || !address) {
    bandeauErreur.innerHTML = `<div class="bandeau-erreur">Merci de remplir tous les champs obligatoires.</div>`;
    return;
  }
  const lignes = lignesACommander();
  if (lignes.length === 0) {
    bandeauErreur.innerHTML = `<div class="bandeau-erreur">Votre panier est vide.</div>`;
    return;
  }

  boutonValider.disabled = true;
  boutonValider.textContent = 'Envoi en cours…';

  // Construit le document au format exact attendu par les règles Firestore
  const numeroCommande = 'WEB-' + Date.now();
  const nouveauColis = {
    ref: numeroCommande,
    courier: '',
    clientName: clientName,
    phone: phone,
    address: address,
    remark: remark,
    status: 'transit',
    confirmed: false,
    items: lignes.map(l => ({
      productId: l.productId,
      variantId: l.variantId,
      qty: l.qty
    })),
    deliveryFee: (typeof etat.fraisAffiches === 'number') ? etat.fraisAffiches : fraisLivraison(), // frais affichés à la cliente sur la page de commande (nombre)
    date: new Date().toISOString()
  };

  db.collection('shipments').add(nouveauColis)
    .then(() => {
      etat.dernierNumeroCommande = numeroCommande;
      etat.brouillonCommande = { clientName: '', phone: '', address: '', remark: '' };
      // Tout a été commandé (panier + éventuel achat direct) : on vide les deux
      etat.achatDirect = null;
      etat.panier = [];
      sauvegarderPanier();
      mettreAJourCompteurPanier();
      naviguerVers('confirmation');
    })
    .catch((erreur) => {
      console.error('Erreur lors de la création de la commande :', erreur);
      bandeauErreur.innerHTML = `<div class="bandeau-erreur">Une erreur est survenue lors de l'envoi de votre commande. Merci de réessayer.</div>`;
      boutonValider.disabled = false;
      boutonValider.textContent = 'Confirmer la commande';
    });
}

    address: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    lien: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>'
  };

  // Uniquement les coordonnées réellement saisies dans le dashboard
  const lignes = [];
  const email = String(c.email || '').trim();
  if (email) lignes.push(`<div class="item-contact">${icones.email}<a href="mailto:${echapper(email)}">${echapper(email)}</a></div>`);
  const tel = String(c.phone || '').trim();
  if (tel) lignes.push(`<div class="item-contact">${icones.phone}<a href="tel:${echapper(tel.replace(/[^+0-9]/g, ''))}">${echapper(tel)}</a></div>`);
  const whatsapp = String(c.whatsapp || '').replace(/[^0-9]/g, '');
  if (whatsapp) lignes.push(`<div class="item-contact">${icones.whatsapp}<a href="https://wa.me/${whatsapp}" target="_blank" rel="noopener">WhatsApp</a></div>`);
  const adresse = String(c.address || '').trim();
  if (adresse) lignes.push(`<div class="item-contact">${icones.address}<span>${echapper(adresse)}</span></div>`);
  [['Instagram', c.instagramUrl], ['Facebook', c.facebookUrl], ['TikTok', c.tiktokUrl]].forEach(([libelle, url]) => {
    const u = urlSure(url, '');
    if (u) lignes.push(`<div class="item-contact">${icones.lien}<a href="${echapper(u)}" target="_blank" rel="noopener">${libelle}</a></div>`);
  });

  return `
    <div class="page-apropos section-etroite" style="margin-top:30px;">
      <h1>${echapper(titre)}</h1>
      ${paragraphesHTML(texte)}
      ${lignes.length ? `<div class="liste-contact">${lignes.join('')}</div>` : ''}
    </div>
  `;
}
