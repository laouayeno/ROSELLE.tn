<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elle روز (Roselle) — Vêtements femme en Tunisie</title>

<!-- V5.9 : description affichée par Google sous le titre (français + anglais) -->
<meta name="description" content="Elle روز (Roselle) : vêtements femme en Tunisie, paiement à la livraison. Women's clothing in Tunisia, cash on delivery. Boutique en ligne roselle site : rosellesite.com">

<!-- Polices : serif éditoriale pour les titres, sans-serif discrète pour le texte.
     V5.9 : chargées SANS bloquer l'affichage. La feuille est d'abord demandée
     pour « print » (le navigateur ne l'attend pas), puis passe à « all » dès
     qu'elle est arrivée. En attendant, le texte s'affiche avec la police du
     téléphone, puis prend la bonne police (display=swap). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;800&family=Jost:wght@300;400&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;800&family=Jost:wght@300;400&display=swap"></noscript>

<!-- SDK Firebase (version "compat", simple à utiliser sans outil de build).
     V5.9 : on le TÉLÉCHARGE dès maintenant (en parallèle du reste), mais il
     n'est EXÉCUTÉ qu'en bas de la page, juste avant le script principal :
     la barre du haut et le message « Chargement… » s'affichent sans l'attendre. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js">

<style>
  /* ===== Jetons de design (couleurs / typo) ===== */
  :root {
    /* Palette neutre éditoriale (noir/blanc/crème) — les noms de variables
       sont conservés (--rose, --dore, etc.) pour ne pas casser tout le CSS
       qui les utilise déjà, mais leurs valeurs sont désormais neutres. */
    --ivoire: #F5F3EF;
    --ivoire-clair: #FFFFFF;
    --rose: #A39A8B;
    --rose-clair: #E4E1DA;
    --rose-fonce: #111111;
    --dore: #8A8A8A;
    --texte: #111111;
    --texte-doux: #6B6B6B;
    --blanc: #FFFFFF;
    --erreur: #A94438;
  }

  * { box-sizing: border-box; }

  /* V2.31 : sur iPhone (surtout en navigation privée), la page pouvait glisser
     à gauche et à droite. On bloque le défilement de côté sur toute la page
     (html), pas seulement dans body. Le défilement vers le bas ne change pas
     et l'en-tête collant continue de marcher. */
  html { overflow-x: hidden; }

  body {
    margin: 0;
    background: var(--ivoire-clair);
    color: var(--texte);
    font-family: 'Inter', sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    /* Empêche la page de déborder sur le côté (barre de défilement horizontale
       sur PC) à cause des sections pleine largeur. "clip" ne gêne pas l'en-tête collant. */
    overflow-x: clip;
  }

  h1, h2, h3, .titre-serif {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    margin: 0;
    color: var(--texte);
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: 'Inter', sans-serif; cursor: pointer; }

  /* ===== En-tête (V2.16) =====
     Disposition inspirée de la référence d'Oussama :
     [menu ☰]      [ ELLE (rose) روز ]      [loupe] [sac]
     Trois colonnes de même largeur à gauche et à droite, pour que
     le nom reste parfaitement centré sur l'écran. */
  header {
    position: sticky; top: 0; z-index: 50;
    background: #FBF6F5;               /* rose très pâle, comme la référence */
    border-top: 1px solid #E6E1DF;
    border-bottom: 1px solid #E6E1DF;
    padding: 8px 14px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .entete-gauche { display: flex; align-items: center; justify-content: flex-start; }
  .entete-droite { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }

  /* Boutons-icônes (menu, recherche, panier) : grande zone tactile pour le doigt */
  .bouton-icone {
    position: relative; background: none; border: none; padding: 8px;
    display: flex; align-items: center; justify-content: center; color: var(--texte);
  }
  .bouton-icone svg { width: 26px; height: 26px; stroke: var(--texte); }
  .bouton-menu-mobile svg { width: 30px; height: 30px; }

  /* Logo complet au centre : « Elle », la rose dans sa couronne et « روز »,
     reliés par des ramages (tiges, feuilles, vrilles). Image à fond transparent. */
  .logo-zone { display: flex; align-items: center; cursor: pointer; }
  .logo-zone .logo-nom { height: 60px; width: auto; display: block; }
  /* Ordinateur (V2.18) : barre fine, liens au centre (choix d'Oussama).
     [            ]  [Accueil  catégories…  À propos]  [logo] [loupe] [sac]
     Trois colonnes : la 1re vide et la 3e de même largeur, pour que les
     liens restent bien centrés. Pas de menu ☰ sur ordinateur. */
  @media (min-width: 860px) {
    header { grid-template-columns: 1fr auto 1fr; column-gap: 20px; padding: 2px 32px; }
    /* V2.20 : barre plus fine (icônes moins espacées) */
    header .bouton-icone { padding: 4px; }
    header .bouton-icone svg { width: 22px; height: 22px; }
    .entete-gauche { display: none; }
    nav.desktop-nav {
      grid-column: 2; grid-row: 1; display: flex !important; align-items: center; gap: 22px;
      max-width: calc(100vw - 500px); overflow-x: auto; scrollbar-width: none; white-space: nowrap;
    }
    nav.desktop-nav::-webkit-scrollbar { display: none; }
    nav.desktop-nav a {
      color: var(--texte); text-decoration: none; font-size: 0.92rem;
      letter-spacing: 0.03em; padding: 6px 0; border-bottom: 1px solid transparent;
    }
    nav.desktop-nav a:hover, nav.desktop-nav a.actif { border-bottom-color: var(--texte); }
    /* Boutons « Collections ⌄ » et « Contact ⌄ » : la flèche se retourne quand la bande est ouverte */
    nav.desktop-nav .bouton-deroulant {
      background: none; border: none; border-bottom: 1px solid transparent; cursor: pointer;
      color: var(--texte); font: inherit; font-size: 0.92rem; letter-spacing: 0.03em;
      padding: 6px 0; display: flex; align-items: center; gap: 6px;
    }
    nav.desktop-nav .bouton-deroulant svg { width: 14px; height: 14px; stroke: var(--texte); transition: transform 0.2s ease; }
    nav.desktop-nav .bouton-deroulant:hover, nav.desktop-nav .bouton-deroulant.ouvert { border-bottom-color: var(--texte); }
    nav.desktop-nav .bouton-deroulant.ouvert svg { transform: rotate(180deg); }
    /* Bande blanche pleine largeur sous la barre, avec la liste des choix
       alignée sous le bouton cliqué (position posée par le script) */
    .bande-deroulante.ouverte {
      display: block; position: absolute; left: 0; right: 0; top: 100%;
      background: var(--blanc); border-bottom: 1px solid #E6E1DF;
      box-shadow: 0 10px 18px rgba(0,0,0,0.06); padding: 22px 0 26px;
    }
    .bande-deroulante.ouverte { z-index: 4; }   /* passe devant le demi-cercle */
    .bande-deroulante .liste-bande { display: flex; flex-direction: column; gap: 4px; min-height: 60px; }
    .bande-deroulante .liste-bande a, .bande-deroulante .liste-bande span {
      color: var(--texte); text-decoration: none; font-size: 0.95rem; letter-spacing: 0.04em; padding: 6px 0;
    }
    .bande-deroulante .liste-bande a:hover { text-decoration: underline; }
    /* V2.20 : le petit logo est collé juste après le dernier lien de la barre
       (« Réseaux sociaux »), quelle que soit la largeur de l'écran */
    .logo-zone { grid-column: 3; grid-row: 1; justify-self: start; margin-left: 4px; }
    .logo-zone .logo-nom { height: 42px; }
    .entete-droite { grid-column: 3; grid-row: 1; justify-self: end; }
  }

  /* Pastille du panier : rond noir en bas à droite du sac */
  .compteur-panier {
    position: absolute; bottom: 2px; right: 0;
    background: #111111; color: var(--blanc);
    font-size: 0.7rem; min-width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #FBF6F5;
  }

  /* ===== Menu ☰ : panneau qui glisse depuis la gauche, du haut en bas ===== */
  .voile-menu {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 90;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .voile-menu.ouvert { opacity: 1; pointer-events: auto; }
  .menu-mobile {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 91;
    width: min(82vw, 340px);
    background: var(--blanc);
    display: flex; flex-direction: column;
    padding: 14px 22px 30px; overflow-y: auto;
    transform: translateX(-100%); transition: transform 0.28s ease, visibility 0.28s;
    box-shadow: 4px 0 18px rgba(0,0,0,0.12);
    /* V2.31 : menu fermé = vraiment caché, Safari ne peut plus faire glisser
       la page vers lui (il est rangé hors de l'écran, à gauche) */
    visibility: hidden;
  }
  .menu-mobile.ouvert { transform: translateX(0); visibility: visible; }
  .menu-mobile .haut-menu { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .menu-mobile .ligne-titre-menu { display: flex; justify-content: space-between; align-items: center; margin: -4px -8px 10px 0; }
  .menu-mobile .etiquette-menu {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Jost', sans-serif; font-weight: 400; letter-spacing: 3px; font-size: 0.95rem; color: var(--texte);
  }
  .menu-mobile .etiquette-menu svg { width: 28px; height: 28px; stroke: var(--texte); }
  .menu-mobile .titre-menu { font-family: 'Playfair Display', serif; font-size: 1.35rem; color: var(--texte); margin-bottom: 4px; }
  /* Faux champ de recherche en haut du menu (ouvre la vraie barre de recherche) */
  .menu-mobile .recherche-menu {
    display: flex; align-items: center; gap: 10px;
    background: #F6F2F1; border: 1px solid #E6E1DF; border-radius: 24px;
    padding: 11px 14px; flex: 1;
    font-size: 0.95rem; color: var(--texte-doux); text-align: left;
  }
  .menu-mobile .recherche-menu svg { width: 20px; height: 20px; stroke: var(--texte-doux); flex-shrink: 0; }
  .menu-mobile a { padding: 14px 0; font-size: 1.05rem; border-bottom: 1px solid #EEE9E7; }
  /* Lien « Accueil » au-dessus des catégories (V2.17) */
  .menu-mobile a.lien-accueil { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .menu-mobile a.lien-accueil svg { width: 20px; height: 20px; stroke: var(--texte); flex-shrink: 0; }
  /* « Collections ⌄ » (V2.18) : la liste se déplie sous la ligne, la flèche se retourne */
  .menu-mobile .deroulant-menu {
    width: 100%; background: none; border: none; border-bottom: 1px solid #EEE9E7; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; font: inherit; font-size: 1.05rem; color: var(--texte); text-align: left;
  }
  .menu-mobile .deroulant-menu svg { width: 18px; height: 18px; stroke: var(--texte); transition: transform 0.2s ease; }
  .menu-mobile .deroulant-bloc.ouvert .deroulant-menu svg { transform: rotate(180deg); }
  .menu-mobile .liste-deroulant { display: none; flex-direction: column; padding: 4px 0 8px 14px; min-height: 40px; }
  .menu-mobile .deroulant-bloc.ouvert .liste-deroulant { display: flex; }
  .menu-mobile .deroulant-bloc { margin-bottom: 18px; }
  /* Texte gris d'une liste vide (menu ☰ et bande ordinateur) */
  .liste-vide { color: #9A8F93; font-size: 0.9rem; font-style: italic; padding: 8px 0; }
  /* Contacts (« Contact ⌄ » en bas du menu) : seulement ceux saisis dans le dashboard */
  .menu-mobile [data-deroulant="contact"] { margin-top: 26px; }
  .menu-mobile [data-deroulant="contact"] + [data-deroulant="reseaux"] { margin-top: -18px; }
  .menu-mobile .liste-deroulant .item-contact a,
  .menu-mobile .liste-deroulant .item-contact span { padding: 8px 0; border-bottom: none; font-size: 0.98rem; }

  /* ===== Recherche : barre sous l'en-tête + résultats ===== */
  .panneau-recherche {
    /* "top" et la hauteur sont calculés à l'ouverture (juste sous l'en-tête) */
    display: none; position: fixed; left: 0; right: 0; top: 70px; z-index: 45;
    background: var(--blanc); border-bottom: 1px solid #E6E1DF;
    padding: 12px 16px; overflow-y: auto;
    box-shadow: 0 8px 18px rgba(0,0,0,0.08);
  }
  .panneau-recherche.ouvert { display: block; }
  .panneau-recherche .ligne-saisie { display: flex; align-items: center; gap: 8px; }
  .panneau-recherche input {
    flex: 1; font-size: 16px; /* 16px : évite le zoom automatique sur iPhone */
    padding: 11px 14px; border: 1px solid #D9D3D0; border-radius: 24px; outline: none;
    font-family: 'Inter', sans-serif;
  }
  .panneau-recherche input:focus { border-color: var(--texte); }
  .panneau-recherche .info-recherche { color: var(--texte-doux); font-size: 0.85rem; margin: 12px 2px 4px; }
  .panneau-recherche .grille-produits { margin-top: 10px; }
  /* V2.27 : aperçu pendant la frappe, en 2 colonnes comme la référence
     d'Oussama : « Articles » à gauche, « Suggestions » à droite, et en bas
     une ligne « Rechercher “…” → » qui ouvre la page de résultats. */
  .apercu-recherche { display: flex; gap: 28px; margin-top: 14px; }
  .apercu-recherche .colonne-articles { flex: 1.6; min-width: 0; }
  .apercu-recherche .colonne-suggestions { flex: 1; min-width: 0; }
  .apercu-recherche h4 {
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.7rem;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--texte-doux);
    padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid #E6E1DF;
  }
  .apercu-article {
    display: flex; gap: 14px; align-items: center; padding: 8px 0; cursor: pointer;
  }
  .apercu-article .vignette {
    width: 52px; height: 70px; flex-shrink: 0; object-fit: cover;
    background: var(--rose-clair); border-radius: 3px;
  }
  .apercu-article .categorie-apercu {
    font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; color: var(--texte-doux);
  }
  .apercu-article .nom-apercu { font-weight: 700; font-size: 0.95rem; color: var(--texte); margin: 2px 0; }
  .apercu-article .prix-apercu { font-size: 0.88rem; color: var(--rose-fonce); }
  .apercu-article:hover .nom-apercu { text-decoration: underline; }
  .suggestion-recherche {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 7px 0; font-family: 'Inter', sans-serif; font-size: 0.95rem;
    font-weight: 600; color: var(--texte); cursor: pointer;
  }
  .suggestion-recherche:hover { text-decoration: underline; }
  .rien-trouve { color: var(--texte-doux); font-size: 0.88rem; padding: 8px 0; }
  .ligne-rechercher-tout {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    margin-top: 14px; padding: 14px 2px 4px; background: none; border: none;
    border-top: 1px solid #E6E1DF; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--texte);
  }
  .ligne-rechercher-tout svg { width: 18px; height: 18px; stroke: var(--texte); }
  @media (max-width: 859px) {
    /* Téléphone : les 2 colonnes l'une sous l'autre, les suggestions en premier */
    .apercu-recherche { flex-direction: column-reverse; gap: 16px; }
  }
  /* Page « Résultats de recherche » : champ centré sous le titre */
  .champ-page-recherche {
    display: flex; align-items: center; gap: 8px; max-width: 620px; margin: 0 auto 26px;
    border: 1px solid var(--texte); border-radius: 24px; padding: 4px 6px 4px 16px;
    position: relative; z-index: 1; background: var(--blanc);
  }
  .champ-page-recherche input {
    flex: 1; border: none; outline: none; font-size: 16px; padding: 8px 0;
    font-family: 'Inter', sans-serif; background: transparent;
  }
  .champ-page-recherche button { background: none; border: none; padding: 6px; cursor: pointer; }
  .champ-page-recherche svg { width: 20px; height: 20px; stroke: var(--texte); }
  @media (min-width: 860px) {
    /* V2.25 : sur ordinateur, la recherche est une fenêtre centrée
       de largeur moyenne (plus sur toute la largeur de la page) */
    .panneau-recherche {
      left: 50%; right: auto; transform: translateX(-50%); width: 680px;
      border: 1px solid #E6E1DF; border-radius: 0 0 14px 14px;
    }
    .panneau-recherche .grille-produits { grid-template-columns: repeat(3, 1fr); }
  }

  /* Barre de liens : seulement sur ordinateur (le téléphone garde le menu ☰) */
  nav.desktop-nav { display: none; }
  .bande-deroulante { display: none; }

  /* ===== Structure générale ===== */
  main { max-width: 1120px; margin: 0 auto; padding: 0 20px 80px; min-height: 60vh; }
  .section-etroite { max-width: 640px; margin: 0 auto; }

  /* ===== Accueil ===== */
  .hero {
    text-align: center;
    padding: 60px 20px 50px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .hero img.logo-hero { width: 120px; height: 120px; object-fit: contain; border-radius: 50%; }
  .hero h1 { font-size: 2.1rem; max-width: 480px; }
  .hero p.accroche { color: var(--texte-doux); font-size: 1rem; max-width: 420px; }

  /* ===== Héros vidéo plein écran (accueil) ===== */
  .hero-video-section {
    position: relative; height: 78vh; max-height: 720px;
    overflow: hidden; background: var(--texte);
    /* Casse la largeur limitée du conteneur "main" (max-width + padding)
       pour que la vidéo touche vraiment les deux bords de l'écran. */
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
  }
  @media (min-width: 860px) {
    /* V2.26 : sur ordinateur, la vidéo descend jusqu'en bas de l'écran
       (hauteur de l'écran moins la barre du haut, sans limite de 720 px) */
    .hero-video-section { height: calc(100vh - 50px); max-height: none; }
  }
  .hero-video-section video,
  .hero-video-section img.media-hero {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .hero-video-texte {
    position: absolute; left: 20px; right: 20px; bottom: 28px; z-index: 2;
    color: var(--blanc);
  }
  .hero-video-texte p {
    font-size: 1.05rem; line-height: 1.4; max-width: 300px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45); margin-bottom: 16px;
  }
  .hero-video-texte .bouton-principal { background: var(--blanc); color: var(--texte); }

  /* ===== Demi-cercle de l'accueil (téléphone, V2.18) =====
     Sur la page d'accueil, le logo quitte la barre du haut et descend dans
     un demi-cercle crème posé sur la vidéo, bordé d'une branche à feuilles
     (dessinée en SVG par domeAccueilHTML). V2.19 : le demi-cercle est
     accroché sous la barre du haut et la suit quand on descend ou remonte
     dans la page. Même principe sur ordinateur, avec un demi-cercle plus petit. */
  .dome-accueil {
    display: block; position: absolute; z-index: 3;
    top: 100%; left: 50%; transform: translateX(-50%);
    width: 52vw; pointer-events: none;
    /* Rien ne dépasse au-dessus du bas de la barre (bouts des racines) */
    clip-path: inset(0 -50% -50% -50%);
  }
  .dome-accueil svg { display: block; width: 100%; height: auto; overflow: visible; }
  .dome-accueil img {
    position: absolute; left: 50%; top: 2%; transform: translateX(-50%);
    width: 56%; height: auto; pointer-events: auto; cursor: pointer;
  }
  /* Accueil : barre sans petit logo et sans trait du bas,
     pour qu'elle se fonde dans le demi-cercle */
  body.sur-accueil header .logo-zone { visibility: hidden; }
  body.sur-accueil header { border-bottom-color: #FBF6F5; }
  /* V2.25 : pendant que la recherche est ouverte, le demi-cercle
     passait par-dessus le champ. On le cache et on remet le petit
     logo dans la barre ; tout revient à la fermeture de la recherche. */
  body.recherche-ouverte #dome-entete { display: none; }
  body.sur-accueil.recherche-ouverte header .logo-zone { visibility: visible; }
  @media (max-width: 859px) {
    /* Barre du haut plus fine : le grand logo est maintenant dans le
       demi-cercle, la barre n'a plus besoin d'être aussi haute */
    header { padding: 2px 10px; }
    header .bouton-icone { padding: 5px; }
    .logo-zone .logo-nom { height: 42px; }
  }
  @media (min-width: 860px) {
    /* V2.20 : demi-cercle et logo plus petits (choix d'Oussama) */
    .dome-accueil { width: min(18vw, 260px); }
  }
  .separateur-dore {
    width: 90px; height: 1px; background: var(--dore); margin: 6px 0;
    position: relative;
  }
  .separateur-dore::after {
    content: '✦'; color: var(--dore); font-size: 0.7rem;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--ivoire-clair); padding: 0 8px;
  }
  .bouton-principal {
    display: inline-block; padding: 14px 34px;
    background: var(--rose-fonce); color: var(--blanc);
    border: none; border-radius: 2px; font-size: 0.95rem; letter-spacing: 0.3px;
    transition: background 0.2s ease;
  }
  .bouton-principal:hover { background: var(--texte); }

  /* Bouton secondaire : contour noir sur fond blanc, pour une action
     moins importante placée sous le bouton noir (ex : « Continuer mes achats »). */
  .bouton-secondaire {
    display: inline-block; padding: 13px 34px;
    background: var(--blanc); color: var(--texte);
    border: 1px solid var(--texte); border-radius: 2px;
    font-size: 0.95rem; letter-spacing: 0.3px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .bouton-secondaire:hover { background: var(--texte); color: var(--blanc); }

  /* Carrousel de catégories, sur toute la largeur de l'écran.
     - iPhone : une grande photo à la fois, on glisse au doigt.
     - PC : environ 3 photos visibles, flèches ‹ › et glisser à la souris. */
  .carrousel-categories {
    position: relative;
    width: 100vw; margin-left: calc(50% - 50vw); /* sort de la largeur limitée de la page */
  }
  .tuiles-categories {
    display: flex; gap: 14px; margin: 0;
    overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 0 20px 6px; scroll-padding-inline: 20px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tuiles-categories::-webkit-scrollbar { display: none; }
  .tuile-categorie {
    display: block; flex: 0 0 82%; scroll-snap-align: center;
    -webkit-user-drag: none;
  }
  .tuile-categorie img { -webkit-user-drag: none; user-select: none; }
  @media (min-width: 640px) { .tuile-categorie { flex-basis: 45%; } }
  @media (min-width: 780px) {
    .tuiles-categories { padding: 0 40px 6px; scroll-padding-inline: 40px; }
    .tuile-categorie { flex-basis: calc((100% - 28px) / 3.25); scroll-snap-align: start; }
  }

  /* Flèches : seulement sur les appareils avec souris (PC) */
  .fleche-carrousel { display: none; }
  @media (hover: hover) and (pointer: fine) and (min-width: 780px) {
    .tuiles-categories { cursor: grab; }
    .tuiles-categories.en-glissement { cursor: grabbing; scroll-snap-type: none; user-select: none; }
    .fleche-carrousel {
      display: flex; align-items: center; justify-content: center;
      position: absolute; top: 42%; transform: translateY(-50%); z-index: 2;
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--blanc); color: var(--texte); border: none;
      box-shadow: 0 2px 10px rgba(17,17,17,0.18); cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .fleche-carrousel svg { width: 20px; height: 20px; }
    .fleche-carrousel.gauche { left: 18px; }
    .fleche-carrousel.droite { right: 18px; }
    .fleche-carrousel.inactive { opacity: 0; pointer-events: none; }
  }
  .tuile-categorie .photo-wrap {
    /* Grande photo plein format, sans arche ici. */
    position: relative; aspect-ratio: 3/4; overflow: hidden; background: var(--rose-clair);
    border-radius: 6px;
  }
  .tuile-categorie img { width: 100%; height: 100%; object-fit: cover; }
  .tuile-categorie span {
    display: block; text-align: center; padding-top: 14px;
    color: var(--texte); font-family: 'Playfair Display', serif;
    font-size: 0.98rem; /* libellé affiché tel que saisi dans le dashboard */
  }

  .bloc-section { margin-top: 64px; }
  .entete-section {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px;
  }
  .entete-section h2 { font-size: 1.5rem; }

  /* ===== Blocs de la page d'accueil gérés depuis le dashboard ===== */
  /* Grande bannière : photo carrée sur mobile, large sur ordinateur, texte en bas */
  .bloc-banniere {
    position: relative; display: block; margin-top: 48px; border-radius: 6px;
    overflow: hidden; background: var(--rose-clair); cursor: pointer;
  }
  .bloc-banniere img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
  @media (min-width: 780px) { .bloc-banniere img { aspect-ratio: 16/7; } }
  .bloc-banniere .texte-banniere {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 20px;
    color: var(--blanc);
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
  }
  .bloc-banniere .texte-banniere h2 { color: var(--blanc); font-size: 1.5rem; }
  .bloc-banniere .texte-banniere p { margin: 6px 0 14px; font-size: 0.95rem; }
  .bloc-banniere .texte-banniere .bouton-principal { background: var(--blanc); color: var(--texte); }

  /* Bloc texte libre — style éditorial aligné à gauche :
     grand titre, petit trait, texte foncé et lisible */
  .bloc-texte { margin: 56px auto 0; max-width: 720px; text-align: left; }
  .bloc-texte h2 { font-size: 1.9rem; line-height: 1.2; margin-bottom: 14px; }
  .bloc-texte h2::after {
    content: ''; display: block; width: 44px; height: 2px;
    background: var(--texte); margin-top: 14px;
  }
  .bloc-texte p { color: var(--texte); font-size: 1.06rem; line-height: 1.75; margin: 0 0 16px; }
  @media (min-width: 780px) {
    .bloc-texte h2 { font-size: 2.2rem; }
    .bloc-texte p { font-size: 1.12rem; }
  }

  /* Bloc texte avec photo / GIF / vidéo (V2.21, choix d'Oussama) :
     - le média prend toute la largeur de l'écran, sans coins arrondis
     - iPhone : média à droite = sous le texte ; média à gauche = au-dessus
     - PC : côte à côte, le média touche le bord de l'écran de son côté */
  .bloc-texte.avec-media { max-width: 1120px; display: grid; gap: 24px; }
  .media-bloc img, .media-bloc video {
    width: 100%; display: block; background: var(--rose-clair);
  }
  /* Sur téléphone, le média sort des marges de la page (bord à bord) */
  .bloc-texte.avec-media .media-bloc { margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
  .bloc-texte.avec-media.media-droite .media-bloc { order: 2; }
  .bloc-texte.avec-media.media-gauche .media-bloc { order: 0; }
  @media (min-width: 780px) {
    /* Sur PC, tout le bloc fait la largeur de l'écran : moitié média, moitié texte */
    .bloc-texte.avec-media {
      max-width: none; width: 100vw;
      margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; align-items: center;
    }
    .bloc-texte.avec-media .media-bloc { margin-left: 0; margin-right: 0; }
    .bloc-texte.avec-media .texte-bloc { padding: 40px clamp(32px, 6vw, 96px); max-width: 640px; justify-self: center; }
  }

  /* Bloc image seule : toute la largeur de l'écran, bord à bord */
  .bloc-image { display: block; margin-top: 48px; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
  .bloc-image img { width: 100%; display: block; }
  .entete-section a { font-size: 0.85rem; color: var(--rose-fonce); border-bottom: 1px solid var(--rose-fonce); }

  /* ===== Pétales flottants décoratifs (touche florale en arrière-plan) ===== */
  .petales-decor {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
  }
  .petale {
    position: absolute; width: 36px; height: 36px; opacity: 0.6;
    animation-name: petale-flotte; animation-iteration-count: infinite; animation-timing-function: ease-in-out;
  }
  .petale svg { width: 100%; height: 100%; }
  .petale svg { filter: drop-shadow(0 2px 2px rgba(138, 15, 86, 0.18)); }
  /* Balancement doux, comme une fleur portée par l'air */
  @keyframes petale-flotte {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(6px, 8px) rotate(12deg); }
    50%  { transform: translate(0, 18px) rotate(22deg); }
    75%  { transform: translate(-6px, 8px) rotate(10deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* Pétales seuls qui tombent doucement en tournant (comme au printemps) */
  .petale-chute {
    position: absolute; top: 0; width: 16px; height: 100%;
    animation: petale-chute linear infinite;
  }
  .petale-chute span {
    display: block; width: 16px; height: 16px; opacity: 0.6;
    animation: petale-tourne ease-in-out infinite alternate;
  }
  .petale-chute svg { width: 100%; height: 100%; display: block; }
  @keyframes petale-chute {
    0%   { transform: translateY(-5%); opacity: 0; }
    8%   { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(95%); opacity: 0; }
  }
  @keyframes petale-tourne {
    0%   { transform: translateX(-14px) rotate(-30deg); }
    100% { transform: translateX(14px) rotate(160deg); }
  }

  /* ===== Barre de filtre/tri du catalogue ===== */
  .barre-filtre {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin: 18px 0 22px; padding-bottom: 14px; border-bottom: 1px solid var(--rose-clair);
    font-size: 0.82rem; color: var(--texte-doux);
  }
  .controles-filtre { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .case-disponible { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .case-disponible input { accent-color: var(--rose-fonce); }
  .select-tri {
    padding: 8px 10px; border: 1px solid var(--rose-clair); border-radius: 2px;
    font-family: 'Inter', sans-serif; font-size: 0.8rem; background: var(--blanc); color: var(--texte);
  }

  /* ===== Grille produits ===== */
  .grille-produits {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 14px;
  }
  @media (min-width: 640px) { .grille-produits { grid-template-columns: repeat(3, 1fr); gap: 26px 20px; } }
  @media (min-width: 960px) { .grille-produits { grid-template-columns: repeat(4, 1fr); } }

  .carte-produit { cursor: pointer; box-shadow: 0 8px 20px rgba(17,17,17,0.1); border-radius: 50% 50% 6px 6px / 14% 14% 6px 6px; }
  .carte-produit .photo-wrap {
    position: relative; aspect-ratio: 1/2.8; overflow: hidden; background: var(--rose-clair);
    /* Arche fine proportionnelle à la largeur de la carte (pas un cercle qui mange toute la photo) :
       50% en horizontal = un arc qui suit exactement la largeur ; 14% en vertical = l'arc d'origine. */
    border-radius: 50% 50% 0 0 / 14% 14% 0 0;
  }
  .carte-produit .photo-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
  /* V2.28 : hors de l'accueil (catégories, collections, recherche), photo
     rectangulaire dans une carte blanche, texte centré (choix B d'Oussama).
     L'accueil garde les photos en arche. */
  body:not(.sur-accueil) .carte-produit { border-radius: 4px; }
  body:not(.sur-accueil) .carte-produit .photo-wrap { aspect-ratio: 2/3; border-radius: 4px 4px 0 0; }
  body:not(.sur-accueil) .carte-produit .infos { padding: 16px 12px 18px; min-height: 0; }
  /* Photos plus grandes : page plus large sur ordinateur (4 par ligne),
     moins de marge sur les côtés au téléphone (2 par ligne) */
  /* (body.page-grille = pages catégorie, collection et résultats de recherche) */
  @media (min-width: 960px) { body.page-grille main { max-width: 1540px; } }
  @media (max-width: 639px) {
    body.page-grille main { padding-left: 10px; padding-right: 10px; }
    body:not(.sur-accueil) .grille-produits { gap: 18px 8px; }
  }
  .carte-produit:hover .photo-wrap img { transform: scale(1.04); }
  /* V2.25 : « Épuisé » et « Soldes » sont écrits sous le prix, sans cadre
     (avant, l'étiquette était sur la photo et l'arche la coupait) */
  .badge-epuise, .badge-solde {
    display: block; margin-top: 8px;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  }
  .badge-epuise { color: var(--texte-doux); }   /* gris */
  .badge-solde  { color: var(--rose-fonce); }   /* couleur du prix */
  .carte-produit .infos {
    background: var(--blanc); padding: 40px 12px 48px; min-height: 150px; text-align: center;
    border-radius: 0 0 6px 6px;
  }
  .carte-produit .nom {
    font-family: 'Inter', sans-serif; font-style: normal; font-weight: 800;
    font-size: 1.02rem; color: var(--texte); line-height: 1.45;
  }
  .carte-produit .prix { font-size: 0.96rem; color: var(--rose-fonce); margin-top: 6px; }
  .prix-barre { color: var(--texte-doux); text-decoration: line-through; font-size: 0.85em; margin-right: 6px; }

  .message-vide { text-align: center; color: var(--texte-doux); padding: 60px 20px; }

  /* ===== Fil d'ariane / retour ===== */
  .lien-retour {
    display: inline-flex; align-items: center; gap: 6px; color: var(--texte-doux);
    font-size: 0.85rem; margin: 24px 0 10px;
  }
  .lien-retour svg { width: 15px; height: 15px; stroke: currentColor; }

  /* ===== Fiche produit ===== */
  .fiche-produit { display: flex; flex-direction: column; gap: 28px; margin-top: 10px; }
  @media (min-width: 780px) { .fiche-produit { flex-direction: row; gap: 48px; } }
  .visuel-produit { flex: 1 1 50%; }
  .visuel-produit .photo-principale {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 3px; background: var(--rose-clair);
  }
  .galerie-miniatures {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .miniature-photo {
    width: 62px; height: 78px; border-radius: 3px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; padding: 0; background: none; flex-shrink: 0;
  }
  .miniature-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniature-photo.selectionnee { border-color: var(--rose-fonce); }
  .details-produit { flex: 1 1 50%; padding-top: 4px; }
  .details-produit .categorie { font-size: 0.78rem; color: var(--dore); text-transform: capitalize; letter-spacing: 0.4px; }
  .details-produit h1 { font-size: 1.7rem; margin-top: 6px; }
  .details-produit .prix { font-size: 1.15rem; color: var(--rose-fonce); margin-top: 10px; }
  .details-produit .ref { color: var(--texte-doux); font-size: 0.78rem; margin-top: 4px; }

  .bloc-choix { margin-top: 26px; }
  .bloc-choix label { display: block; font-size: 0.82rem; color: var(--texte-doux); margin-bottom: 8px; }
  /* Nom de la couleur choisie, affiché à côté du mot « Couleur » */
  .nom-couleur-choisie { color: var(--texte); font-weight: 500; }
  /* Le compteur de quantité est déjà espacé par son bloc « Quantité » */
  .bloc-choix .selecteur-qte { margin-top: 0; }

  .tuiles-formule { display: flex; flex-direction: column; gap: 10px; }
  .tuile-formule {
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--rose-clair); border-radius: 4px; padding: 12px 16px;
    background: var(--blanc); cursor: pointer; text-align: left;
  }
  .tuile-formule.selectionnee { border-color: var(--rose-fonce); background: var(--ivoire); }
  .tuile-formule .gauche-formule { display: flex; flex-direction: column; gap: 2px; }
  .tuile-formule .label-formule { font-size: 0.9rem; }
  .tuile-formule .badge-meilleure { font-size: 0.65rem; color: var(--dore); letter-spacing: 0.4px; text-transform: uppercase; }
  .tuile-formule .prix-formule { font-size: 0.95rem; font-weight: 600; color: var(--rose-fonce); white-space: nowrap; }
  .tuile-formule .economie-formule { display: block; font-weight: 500; font-size: 0.75rem; text-align: right; color: var(--dore); }

  .unites-pack { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .unite-pack { border: 1px solid var(--rose-clair); border-radius: 4px; padding: 14px; }
  .unite-pack .titre-unite { font-size: 0.82rem; color: var(--texte-doux); margin-bottom: 10px; }
  .unite-pack .options-couleur { margin-bottom: 10px; }
  .unite-pack select {
    flex: 1; padding: 10px; border: 1px solid var(--rose-clair); border-radius: 2px;
    font-family: 'Inter', sans-serif; font-size: 0.85rem; background: var(--blanc); color: var(--texte);
  }
  .options-couleur { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch-couleur {
    width: 46px; height: 46px; border-radius: 50%; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; padding: 0; background: none;
  }
  .swatch-couleur img { width: 100%; height: 100%; object-fit: cover; }
  .swatch-couleur.selectionne { border-color: var(--rose-fonce); }

  .options-taille { display: flex; gap: 8px; flex-wrap: wrap; }
  .bouton-taille {
    min-width: 46px; height: 40px; padding: 0 12px;
    border: 1px solid var(--rose-clair); background: var(--blanc); color: var(--texte);
    border-radius: 2px; font-size: 0.85rem;
  }
  .bouton-taille.selectionne { border-color: var(--rose-fonce); background: var(--rose-fonce); color: var(--blanc); }
  .bouton-taille:disabled { opacity: 0.35; text-decoration: line-through; cursor: not-allowed; }

  .stock-info { font-size: 0.8rem; color: var(--texte-doux); margin-top: 12px; }
  .stock-info.faible { color: var(--erreur); }

  .selecteur-qte { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
  .selecteur-qte button {
    width: 34px; height: 34px; border: 1px solid var(--rose-clair); background: var(--blanc);
    font-size: 1rem; border-radius: 50%;
  }
  .selecteur-qte span { min-width: 20px; text-align: center; }

  .bouton-ajouter {
    width: 100%; margin-top: 24px; padding: 15px;
    background: var(--rose-fonce); color: var(--blanc); border: none; border-radius: 2px; font-size: 0.95rem;
  }
  .bouton-ajouter:disabled { background: var(--rose-clair); color: var(--texte-doux); cursor: not-allowed; }

  .bouton-achat-direct {
    width: 100%; margin-top: 10px; padding: 15px;
    background: none; color: var(--rose-fonce); border: 1px solid var(--rose-fonce); border-radius: 2px; font-size: 0.95rem;
  }
  .bouton-achat-direct:disabled { border-color: var(--rose-clair); color: var(--texte-doux); cursor: not-allowed; }

  .description-produit { margin-top: 28px; color: var(--texte-doux); font-size: 0.9rem; }

  /* ===== Panier ===== */
  .ligne-panier {
    display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid rgba(184,147,90,0.18);
  }
  .ligne-panier img { width: 78px; height: 100px; object-fit: cover; border-radius: 3px; background: var(--rose-clair); }
  .ligne-panier .infos-ligne { flex: 1; }
  .ligne-panier .nom { font-size: 0.95rem; }
  .ligne-panier .variante { font-size: 0.8rem; color: var(--texte-doux); margin-top: 3px; }
  .ligne-panier .bas-ligne { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .qte-panier { display: flex; align-items: center; gap: 10px; }
  .qte-panier button {
    width: 26px; height: 26px; border: 1px solid var(--rose-clair); background: var(--blanc); border-radius: 50%;
  }
  /* « Retirer » (panier) écrit en rouge pour bien le repérer */
  .bouton-supprimer { background: none; border: none; color: var(--erreur); font-size: 0.78rem; text-decoration: underline;
    margin-top: 12px; /* un peu d'espace sous les boutons + et − */
  }
  .prix-ligne { font-size: 0.9rem; color: var(--rose-fonce); }

  .recap-total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 20px 0; margin-top: 8px; border-top: 1px solid var(--dore);
  }
  .recap-total .label { font-size: 0.95rem; }
  .recap-total .montant { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--rose-fonce); }

  .panier-vide { text-align: center; padding: 70px 20px; color: var(--texte-doux); }

  /* ===== Formulaire commande ===== */
  .champ { margin-bottom: 18px; }
  .champ label { display: block; font-size: 0.82rem; color: var(--texte-doux); margin-bottom: 7px; }
  .champ input, .champ textarea, .champ select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--rose-clair); border-radius: 2px;
    font-family: 'Inter', sans-serif; font-size: 0.92rem; background: var(--blanc); color: var(--texte);
  }
  .champ input:focus, .champ textarea:focus, .champ select:focus { outline: none; border-color: var(--rose-fonce); }
  .champ textarea { resize: vertical; min-height: 70px; }
  .erreur-champ { color: var(--erreur); font-size: 0.78rem; margin-top: 5px; display: none; }

  .rappel-paiement {
    background: var(--rose-clair); border-radius: 3px; padding: 14px 16px;
    font-size: 0.85rem; color: var(--rose-fonce); margin-bottom: 26px;
  }

  .recap-commande { background: var(--ivoire); border-radius: 3px; padding: 18px; margin-bottom: 26px; }
  .recap-commande .ligne-recap { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 5px 0; }

  /* ===== Confirmation ===== */
  .bloc-confirmation { text-align: center; padding: 70px 20px; }
  .bloc-confirmation .icone-check {
    width: 64px; height: 64px; border-radius: 50%; background: var(--rose-fonce);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 22px;
  }
  .bloc-confirmation .icone-check svg { width: 30px; height: 30px; stroke: var(--blanc); }
  .bloc-confirmation h1 { font-size: 1.6rem; }
  .bloc-confirmation .num-commande { color: var(--rose-fonce); font-size: 0.95rem; margin-top: 10px; }
  .bloc-confirmation p.detail { color: var(--texte-doux); margin-top: 18px; max-width: 420px; margin-left: auto; margin-right: auto; }

  /* ===== À propos ===== */
  .page-apropos { padding-top: 20px; }
  .page-apropos h1 { font-size: 1.8rem; margin-bottom: 22px; }

     Doit rester AVANT le script principal, qui l'utilise tout de suite. -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   CONFIGURATION FIREBASE — projet réel roselle-stock
   Ces clés sont publiques par nature (config web Firebase) :
   la sécurité est assurée par les règles Firestore, pas ici.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDjBus6zFIupNlR4Ugysc5wzyyXkgddu6Q",
  authDomain: "roselle-stock.firebaseapp.com",
  databaseURL: "https://roselle-stock-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "roselle-stock",
  storageBucket: "roselle-stock.firebasestorage.app",
  messagingSenderId: "792032275520",
  appId: "1:792032275520:web:60d33d51f10afe876b83a5"
};

firebase.initializeApp(firebaseConfig);

/* ============================================================
   V5.7 : PLUS DE reCAPTCHA (APP CHECK) SUR LE SITE DE VENTE
   Le site LIT seulement le catalogue et l'apparence en direct
   (lecture publique autorisée par les règles Firestore), sans
   vérification reCAPTCHA payante à chaque visiteuse.
   Il n'ÉCRIT plus rien dans Firestore : commandes et statistiques
   passent par le Worker Cloudflare (/api/commande, /api/stats),
   qui seul a la clé d'écriture. Les commandes sont protégées par
   Turnstile (anti-robot gratuit de Cloudflare) et des limites.
   App Check reste utilisé par ROSELLE Stock.
   ============================================================ */
const db = firebase.firestore();

/* ============================================================
   STATISTIQUES DE VISITE (anonymes) — collection Firestore siteStats
   ------------------------------------------------------------
   V5.7 : la page n'écrit plus elle-même dans Firestore. Elle envoie
   un petit « événement » au Worker (/api/stats), qui ajoute +1 dans
   le bon tiroir. Le format des documents ne change pas.
   Chaque jour est découpé en 50 petits documents « tiroirs »
   (ex. siteStats/2026-10-11_07). Chaque visiteuse écrit toujours
   dans le même tiroir, tiré au hasard à son arrivée : ainsi, pendant
   un pic (20 000 visiteuses en même temps), les écritures sont
   réparties sur 50 documents au lieu d'un seul, et Firestore ne
   sature pas. ROSELLE Stock additionne les tiroirs de chaque jour.
   Les documents contiennent uniquement des compteurs : visiteurs, sessions, téléphone ou
   ordinateur, provenance (Instagram, Facebook, TikTok, Google…),
   heure de visite, vues et ajouts au panier par article.
   Aucune donnée personnelle n'est enregistrée (pas de nom, pas
   d'adresse IP, pas de cookie publicitaire).
   Le tableau de bord de ROSELLE Stock relit ces compteurs.
   Toute erreur est ignorée : le suivi ne peut jamais bloquer le site.
   Pour ne pas compter ses propres visites : ouvrir une fois le site
   avec ?nostats=1 à la fin de l'adresse (?nostats=0 pour annuler).
   ============================================================ */
const suivi = (() => {
  const lire = (stockage, cle) => { try { return stockage.getItem(cle); } catch (e) { return null; } };
  const ecrire = (stockage, cle, valeur) => { try { stockage.setItem(cle, valeur); } catch (e) {} };

  try {
    const p = new URLSearchParams(window.location.search).get('nostats');
    if (p === '1') ecrire(localStorage, 'roselle_nostats', '1');
    if (p === '0') { try { localStorage.removeItem('roselle_nostats'); } catch (e) {} }
  } catch (e) {}
  const actif = !navigator.webdriver && lire(localStorage, 'roselle_nostats') !== '1';

  // Date et heure de Tunisie (pas celles du téléphone de la cliente)
  function jour() {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Tunis', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  }
  function heure() {
    try { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Tunis', hour: '2-digit', hourCycle: 'h23' }).format(new Date()).slice(0, 2); }
    catch (e) { return String(new Date().getHours()).padStart(2, '0'); }
  }

  // Nombre de tiroirs par jour (doit rester en phase avec les règles Firestore : 00 à 49)
  const NB_TIROIRS = 50;

  // Tiroir de cette visiteuse : tiré au hasard une fois, puis gardé pour tout l'onglet
  function tiroir() {
    let n = parseInt(lire(sessionStorage, 'roselle_tiroir'), 10);
    if (!(n >= 0 && n < NB_TIROIRS)) {
      n = Math.floor(Math.random() * NB_TIROIRS);
      ecrire(sessionStorage, 'roselle_tiroir', String(n));
    }
    return String(n).padStart(2, '0');
  }

  // V5.7 : envoi d'un événement au Worker. « keepalive » : l'envoi
  // continue même si la cliente change de page ou ferme l'onglet.
  function envoyer(evenement) {
    if (!actif) return;
    try {
      fetch('/api/stats', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ ...evenement, tiroir: parseInt(tiroir(), 10) }),
        keepalive: true
      }).catch(() => {});
    } catch (e) {}
  }

  // Provenance : paramètre utm_source, sinon site précédent, sinon navigateur intégré d'une appli
  function provenance() {
    let source = '';
    try { source = (new URLSearchParams(window.location.search).get('utm_source') || '').toLowerCase(); } catch (e) {}
    let ref = '';
    try { ref = document.referrer ? new URL(document.referrer).hostname.toLowerCase() : ''; } catch (e) {}
    if (ref === window.location.hostname) ref = '';
    const ua = navigator.userAgent || '';
    const texte = source + ' ' + ref;
    if (/instagram|\big\b/.test(texte) || /Instagram/i.test(ua)) return 'instagram';
    if (/facebook|fb\.|\bfb\b|messenger/.test(texte) || /FBAN|FBAV|FB_IAB/i.test(ua)) return 'facebook';
    if (/tiktok/.test(texte) || /musical_ly|BytedanceWebview|TikTok/i.test(ua)) return 'tiktok';
    if (/google/.test(texte)) return 'google';
    if (/whatsapp|wa\.me/.test(texte)) return 'whatsapp';
    if (!texte.trim()) return 'direct';
    return 'autre';
  }

  // Une visite par navigateur et par jour, une session par onglet ouvert
  function compterVisite() {
    if (lire(sessionStorage, 'roselle_session')) return;
    ecrire(sessionStorage, 'roselle_session', '1');
    const aujourdhui = jour();
    const evenement = { e: 'visite', heure: heure() };
    if (lire(localStorage, 'roselle_dernier_jour') !== aujourdhui) {
      evenement.nouveauJour = true;
      evenement.nouvelleVisiteuse = !lire(localStorage, 'roselle_deja_venue');
      evenement.appareil = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') ? 'mobile' : 'desktop';
      evenement.source = provenance();
      ecrire(localStorage, 'roselle_dernier_jour', aujourdhui);
      ecrire(localStorage, 'roselle_deja_venue', '1');
    }
    envoyer(evenement);
  }

  // Une seule fois par session et par clé (évite de compter 10 fois la même fiche)
  function premiereFois(cle) {
    let vus = [];
    try { vus = JSON.parse(lire(sessionStorage, 'roselle_vus') || '[]'); } catch (e) {}
    if (vus.includes(cle)) return false;
    vus.push(cle);
    ecrire(sessionStorage, 'roselle_vus', JSON.stringify(vus.slice(-200)));
    return true;
  }

  const idValide = id => typeof id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(id);

  return {
    visite: compterVisite,
    vueArticle(id) { if (idValide(id) && premiereFois('v:' + id)) envoyer({ e: 'vue', id }); },
    ajoutPanier(id) {
      if (!idValide(id)) return;
      if (premiereFois('p:' + id)) envoyer({ e: 'panier', id });
      if (premiereFois('panier')) envoyer({ e: 'panierSession' });
    },
    passageCommande() { if (premiereFois('commande')) envoyer({ e: 'commande' }); }
  };
})();

/* ============================================================
   ÉTAT GLOBAL DE L'APPLICATION
   ============================================================ */
// Clé du panier dans le stockage du navigateur. Elle DOIT être déclarée avant
// "etat", qui relit le panier dès sa création : déclarée après, la lecture
// échouait en silence et le panier repartait vide à chaque rechargement.
const CLE_PANIER = 'roselle_panier';

const etat = {
  bandeOuverte: null,          // ordinateur : bande ouverte sous la barre (collections / contact)
  menuDeplie: {},              // téléphone : listes dépliées dans le menu ☰ (collections, contact)
  produits: [],           // liste des produits chargés depuis publicCatalog
  chargementTermine: false,
  vueActuelle: 'accueil',  // accueil | catalogue | produit | panier | commande | confirmation | apropos
  parametresVue: {},       // ex: { categorie: 'robes' } ou { produitId: '...' }
  panier: chargerPanierDepuisMemoire(), // [{ productId, variantId, name, cat, price, size, color, photo, qty, stockDispo }]
  produitCourant: { couleurChoisie: null, tailleChoisie: null, quantiteChoisie: 1, formuleChoisie: null, selectionsPack: [] },
  filtresCatalogue: { tri: 'defaut', disponibleSeulement: false }, // barre de tri/filtre du catalogue
  reglages: {},            // contenu brut du document siteSettings/main (vide = valeurs par défaut)
  achatDirect: null,       // lignes du bouton "Acheter maintenant" (séparées du panier), sinon null
  // Ce que la cliente a déjà tapé dans le formulaire de commande : gardé en
  // mémoire (le temps de la visite) pour le retrouver si elle part
  // « Continuer mes achats » puis revient commander.
  brouillonCommande: { clientName: '', phone: '', address: '', remark: '', gouvernorat: '', ville: '' },
  reglagesCharges: false   // devient vrai à la première réponse (ou après un court délai de secours)
};

/* ============================================================
   V2.35 : CE QUE LA CLIENTE A CHOISI OU TAPÉ, GARDÉ APRÈS UN RAFRAÎCHISSEMENT
   La page elle-même est déjà dans l'adresse (#produit/…, #commande).
   On garde en plus : le formulaire de commande, l'article d'« Acheter
   maintenant » et la couleur / taille / quantité de la fiche article.
   sessionStorage : tout disparaît quand la cliente ferme l'onglet, et
   après l'envoi de la commande. Rien ne part sur Internet.
   ============================================================ */
const CLE_SAISIE = 'roselle_saisie';
let choixProduitEnAttente = null; // choix à remettre sur la fiche article après un rafraîchissement

function memoriserSaisie() {
  try {
    sessionStorage.setItem(CLE_SAISIE, JSON.stringify({
      brouillon: etat.brouillonCommande,
      achatDirect: etat.achatDirect,
      produitId: etat.vueActuelle === 'produit' ? etat.parametresVue.produitId : null,
      choix: etat.produitCourant
    }));
  } catch (e) {} // navigateur qui refuse (mode privé) : tant pis, rien n'est gardé
}

// Relit ce qui avait été gardé (une seule fois, au chargement de la page).
(function restaurerSaisie() {
  let m = null;
  try { m = JSON.parse(sessionStorage.getItem(CLE_SAISIE) || 'null'); } catch (e) {}
  if (!m || typeof m !== 'object') return;
  // Formulaire : seulement des textes, et seulement les champs connus.
  if (m.brouillon && typeof m.brouillon === 'object') {
    for (const cle of Object.keys(etat.brouillonCommande)) {
      if (typeof m.brouillon[cle] === 'string') etat.brouillonCommande[cle] = m.brouillon[cle].slice(0, 500);
    }
  }
  if (Array.isArray(m.achatDirect) && m.achatDirect.length) {
    etat.achatDirect = m.achatDirect.filter(l => l && typeof l === 'object' && typeof l.productId === 'string');
  }
  if (typeof m.produitId === 'string' && m.choix && typeof m.choix === 'object') {
    choixProduitEnAttente = { produitId: m.produitId, choix: m.choix };
  }
})();

// Le rafraîchissement (ou l'iPhone qui met l'onglet en veille) déclenche ces événements.
window.addEventListener('pagehide', memoriserSaisie);
document.addEventListener('visibilitychange', () => { if (document.hidden) memoriserSaisie(); });

// Remet la couleur, la taille et la quantité choisies avant le rafraîchissement,
// dès que la fiche de cet article est affichée avec ses données.
function remettreChoixProduit(produitId) {
  const attente = choixProduitEnAttente;
  if (!attente || attente.produitId !== produitId) return;
  const produit = trouverProduit(produitId);
  if (!produit) return; // catalogue pas encore chargé : on réessaiera au prochain affichage
  choixProduitEnAttente = null;
  const c = attente.choix;
  // Formules en pack : trop de choix à refaire, la cliente recommence simplement.
  if (c.formuleChoisie && c.formuleChoisie !== 'unitaire') return;
  if (c.formuleChoisie === 'unitaire' && document.getElementById('formule-unitaire')) choisirFormule('unitaire', 1);
  const variantes = produit.variants || [];
  if (typeof c.couleurChoisie !== 'string' || !variantes.some(v => v.color === c.couleurChoisie)) return;
  if (!document.querySelector('.swatch-couleur')) return;
  choisirCouleur(produitId, c.couleurChoisie);
  const variante = variantes.find(v => v.color === c.couleurChoisie && v.size === c.tailleChoisie);
  if (!variante || Number(variante.qty) <= 0) return;
  choisirTaille(produitId, variante.color, variante.size);
  const qte = Math.round(Number(c.quantiteChoisie)) || 1;
  if (qte > 1) changerQuantite(qte - 1); // plafonnée au stock comme d'habitude
}

// V2.35 : les 24 gouvernorats, avec le code demandé par la société de livraison
// Bestway (le même que dans le Stock). Le colis arrive ainsi prêt à être envoyé.
const GOUVERNORATS = [
  ['Ariana', '2080'], ['Béja', '9000'], ['Ben Arous', '2013'], ['Bizerte', '7000'], ['Gabès', '6000'],
  ['Gafsa', '2100'], ['Jendouba', '8100'], ['Kairouan', '3100'], ['Kasserine', '1200'], ['Kébili', '4200'],
  ['La Manouba', '2010'], ['Le Kef', '7100'], ['Mahdia', '5100'], ['Médenine', '4100'], ['Monastir', '5000'],
  ['Nabeul', '8000'], ['Sfax', '3000'], ['Sidi Bouzid', '9100'], ['Siliana', '6100'], ['Sousse', '4000'],
  ['Tataouine', '3200'], ['Tozeur', '2200'], ['Tunis', '1000'], ['Zaghouan', '1100']
];
function nomGouvernorat(code) {
  const g = GOUVERNORATS.find(x => x[1] === code);
  return g ? g[0] : '';
}

// Liste des catégories mises en avant, dans l'ordre voulu.
// La comparaison ignore la casse/les accents pour être robuste aux données réelles.
const CATEGORIES_PRINCIPALES = ['robes', 'pulls', 'pantalons', 'accessoires'];

/* ============================================================
   RÉGLAGES DU SITE — document Firestore siteSettings/main
   ------------------------------------------------------------
   Ces réglages sont saisis depuis la page « Apparence » de
   ROSELLE Stock. Tous les champs sont optionnels : un champ
   absent, vide ou invalide garde la valeur par défaut ci-dessous.
   Le site fonctionne donc normalement même si le document
   n'existe pas encore.
   ============================================================ */
const REGLAGES_PAR_DEFAUT = {
  brand: { name: 'Elle روز', logoUrl: 'logo.jpg' },
  hero: {
    type: 'video',
    // V6.0 : 2 vidéos d'accueil. mediaUrl = en hauteur (téléphone),
    // mediaUrlPc = en largeur (PC, tablette couchée). Fichiers dans public/, servis
    // par Cloudflare (trafic gratuit). TEST TEMPORAIRE avec une vidéo d'exemple
    // (V6.1 : version plus haute qualité, environ 4,5 Mbit/s sur PC).
    mediaUrl: 'hero-test2-telephone.mp4',
    mediaUrlPc: 'hero-test2-pc.mp4',
    posterUrl: 'logo.jpg',
    text: 'Une collection pensée avec féminité, élégance et confiance.',
    buttonLabel: 'Découvrir la collection',
    buttonLink: { type: 'catalog' }
  },
  about: {
    title: 'À propos de ROSELLE',
    body: "ROSELLE est une marque de prêt-à-porter féminin pensée pour la femme d'aujourd'hui : féminité, élégance et confiance, dans chaque pièce de la collection.\n\nNos commandes sont préparées avec soin et livrées partout où vous êtes, avec paiement en espèces à la réception de votre colis."
  },
  shipping: { fee: 8 } // frais de livraison fixes en DT
};

// Échappe un texte avant de l'insérer dans le HTML (évite qu'un caractère
// comme < ou " saisi dans le dashboard casse la page).
function echapper(texte) {
  return (texte === undefined || texte === null ? '' : String(texte))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// V2.29 : met une valeur dans le code d'un bouton (onclick="...") sans que
// ses guillemets ou caractères spéciaux puissent casser ou détourner le bouton.
// S'écrit SANS guillemets autour : onclick="choisirCouleur(${enJs(couleur)})".
function enJs(valeur) {
  return echapper(JSON.stringify(valeur === undefined || valeur === null ? '' : String(valeur)));
}

// N'accepte que les adresses https:// ; sinon renvoie la valeur de secours.
function urlSure(url, secours) {
  const u = (url === undefined || url === null ? '' : String(url)).trim();
  return /^https:\/\//i.test(u) ? u : (secours || '');
}

/* ===== V2.32 : photos et vidéos plus légères (Cloudinary) =====
   Avant, le site téléchargeait chaque photo dans sa taille d'origine
   (souvent plusieurs Mo). Maintenant on demande à Cloudinary une copie :
     - à la taille de l'écran (jamais plus grande que la photo d'origine),
     - au format le plus léger que le téléphone sait lire (f_auto),
     - en qualité « best » : la plus haute de la compression automatique,
       pour garder la finesse des photos professionnelles.
   La photo d'origine reste intacte chez Cloudinary.
   Seules les adresses Cloudinary « simples » sont modifiées : les autres
   (ou celles qui ont déjà des réglages) sont gardées telles quelles.
   V5.6 (choix d'Oussama) :
     - sur PC : rien ne change (qualité « best ») ;
     - sur téléphone : qualité « good » et au maximum 2 pixels par point
       (un 3e pixel ne se voit presque pas, mais double presque le poids),
       sauf pour les cartes en arche de l'accueil ;
       économise le quota gratuit de Cloudinary pendant le lancement ;
     - cartes en arche de l'accueil : la photo est découpée chez Cloudinary
       à la forme exacte de la carte (voir photoOptimisee), donc nette. */
const REGLAGE_PHOTO = 'f_auto,q_auto:';
// Écran plus étroit que ça = téléphone (même seuil que la fiche produit)
const LARGEUR_TELEPHONE = 780;
const REGLAGE_VIDEO = 'q_auto:best,c_limit,w_1920,h_1920';

// largeurAffichee = largeur à l'écran en points (ex. 400), ou 'ecran' pour toute la largeur
// forme (facultatif, V5.6) = proportions du cadre, ex. '1:2.8' (largeur:hauteur) :
// la photo est alors découpée au centre à cette forme, comme le fait l'écran
// (object-fit: cover), au lieu d'être agrandie et floue.
function photoOptimisee(url, largeurAffichee, forme) {
  // Adresse non Cloudinary (ex. logo.jpg du site) : rendue telle quelle, comme avant
  const u = url === undefined || url === null ? '' : String(url).trim();
  const m = u.match(/^(https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\/)(.+)$/i);
  if (!m || !adresseSansReglage(m[2])) return u;
  // Rien n'est affiché plus large que l'écran : on ne demande jamais plus grand
  const ecran = window.innerWidth || 400;
  const points = largeurAffichee === 'ecran' ? ecran : Math.min(largeurAffichee, ecran);
  // V5.6 : téléphone = qualité « good » et 2 pixels par point au maximum ; PC inchangé
  const telephone = ecran < LARGEUR_TELEPHONE;
  const qualite = telephone ? 'good' : 'best';
  // Écrans « Retina » : 2 ou 3 pixels par point (on s'arrête à 3, ou à 2 sur téléphone).
  // Exception : les cadres découpés (cartes en arche de l'accueil) gardent 3 pixels
  // par point, pour que les photos de l'accueil soient bien nettes sur iPhone.
  const maxPixelsParPoint = telephone && !forme ? 2 : 3;
  const pixels = points * Math.min(Math.max(window.devicePixelRatio || 1, 1), maxPixelsParPoint);
  // Arrondi au-dessus par paliers de 200 px (moins de copies différentes), maximum 2400 px
  const largeur = Math.min(2400, Math.ceil(pixels / 200) * 200);
  // Découpe à la forme du cadre (c_lfill : jamais agrandie au-delà de l'original)
  const decoupe = forme && /^\d+(\.\d+)?:\d+(\.\d+)?$/.test(forme)
    ? 'c_lfill,ar_' + forme + ',g_center'
    : 'c_limit';
  return m[1] + REGLAGE_PHOTO + qualite + ',' + decoupe + ',w_' + largeur + '/' + m[2];
}

function videoOptimisee(url) {
  const u = url === undefined || url === null ? '' : String(url).trim();
  const m = u.match(/^(https:\/\/res\.cloudinary\.com\/[^/]+\/video\/upload\/)(.+)$/i);
  if (!m || !adresseSansReglage(m[2])) return u;
  // Vidéo limitée à 1920 px (Full HD) : une vidéo 4K devient bien plus légère
  return m[1] + REGLAGE_VIDEO + '/' + m[2];
}

// Vrai si l'adresse commence par le numéro de version (v123…/) ou directement
// par le nom du fichier, donc sans réglage Cloudinary déjà présent.
function adresseSansReglage(reste) {
  const premier = reste.split('/')[0];
  return /^v\d+$/.test(premier) || !/[_,]/.test(premier) || reste.indexOf('/') === -1;
}

// Sécurité : si Cloudinary n'arrive pas à fournir la copie allégée
// (ex. vidéo très lourde encore en préparation), on recharge l'original.
document.addEventListener('error', (e) => {
  const el = e.target;
  if (!el || !el.getAttribute) return;
  const src = el.getAttribute('src') || '';
  if (src.indexOf('/upload/' + REGLAGE_PHOTO) !== -1) {
    el.setAttribute('src', src.replace(/\/upload\/f_auto,q_auto:[^/]+\//, '/upload/'));
  } else if (src.indexOf('/upload/' + REGLAGE_VIDEO + '/') !== -1) {
    el.setAttribute('src', src.replace('/upload/' + REGLAGE_VIDEO + '/', '/upload/'));
    // pour <source>, il faut relancer la vidéo qui la contient
    if (el.tagName === 'SOURCE' && el.parentElement && el.parentElement.load) el.parentElement.load();
  }
}, true);

// Lit un champ texte d'une section des réglages, avec repli sur la valeur par défaut.
function reglageTexte(section, champ) {
  const brut = etat.reglages && etat.reglages[section] ? etat.reglages[section][champ] : undefined;
  if (typeof brut === 'string' && brut.trim() !== '') return brut.trim();
  const defaut = REGLAGES_PAR_DEFAUT[section];
  return defaut && defaut[champ] !== undefined ? defaut[champ] : '';
}

// Lit un champ URL d'une section des réglages, avec repli sur la valeur par défaut.
function reglageUrl(section, champ) {
  const brut = etat.reglages && etat.reglages[section] ? etat.reglages[section][champ] : undefined;
  const defaut = REGLAGES_PAR_DEFAUT[section] ? REGLAGES_PAR_DEFAUT[section][champ] : '';
  return urlSure(brut, defaut || '');
}

// Frais de livraison : nombre positif ou nul saisi dans le dashboard, sinon 8 DT.
function fraisLivraison() {
  const brut = etat.reglages && etat.reglages.shipping ? etat.reglages.shipping.fee : undefined;
  const n = Number(brut);
  if (brut !== undefined && brut !== null && brut !== '' && Number.isFinite(n) && n >= 0) return n;
  return REGLAGES_PAR_DEFAUT.shipping.fee;
}

// Catégories à afficher (tuiles + menu) : celles du dashboard, dans leur ordre,
// sinon les 4 catégories par défaut.
function categoriesAffichees() {
  const liste = etat.reglages && Array.isArray(etat.reglages.categories) ? etat.reglages.categories : [];
  const valides = liste
    .filter(c => c && c.id && c.visible !== false)
    .map(c => ({
      id: String(c.id),
      label: c.label ? String(c.label) : capitaliser(String(c.id)),
      imageUrl: urlSure(c.imageUrl, '')
    }));
  const liste2 = valides.length ? valides : CATEGORIES_PRINCIPALES.map(id => ({ id, label: capitaliser(id), imageUrl: '' }));
  // Une catégorie sans aucun article n'apparaît pas (barre, menu ☰, tuiles de l'accueil)
  return liste2.filter(c => produitsParCategorie(c.id).length > 0);
}

// Collections créées dans le Stock (Apparence > Collections), dans leur ordre,
// sans celles qui sont cachées ou vides. Chaque article a au plus une collection
// (son champ « collection » = id de la collection).
function collectionsAffichees() {
  const liste = etat.reglages && Array.isArray(etat.reglages.collections) ? etat.reglages.collections : [];
  return liste
    .filter(c => c && c.id && c.label && c.visible !== false)
    // Une collection vide (aucun article rangé dedans) n'apparaît pas sur le site
    .filter(c => etat.produits.some(p => p.collection === c.id))
    .map(c => ({ id: String(c.id), label: String(c.label) }));
}

function ouvrirCollection(element) {
  naviguerVers('collection', { collectionId: element.dataset.col });
}

// Libellé d'une catégorie (celui du dashboard s'il existe), à partir de son identifiant.
// Le résultat doit toujours être échappé avant affichage : il peut venir de l'adresse de la page.
function libelleCategorie(id) {
  const trouvee = categoriesAffichees().find(c => normaliser(c.id) === normaliser(id));
  return trouvee ? trouvee.label : capitaliser(String(id || ''));
}

// Attributs HTML d'un lien configurable (catalogue, catégorie, produit, à propos).
// Les valeurs passent par des attributs data-* échappés, jamais dans du code JS.
function lienAttributs(lien) {
  const l = lien && typeof lien === 'object' ? lien : { type: 'catalog' };
  return `data-lien-type="${echapper(l.type || 'catalog')}" data-lien-valeur="${echapper(l.value || '')}" onclick="suivreLien(this); return false;"`;
}

function suivreLien(element) {
  const type = element.dataset.lienType;
  const valeur = element.dataset.lienValeur;
  if (type === 'category' && valeur) naviguerVers('catalogue', { categorie: valeur });
  else if (type === 'product' && valeur) naviguerVers('produit', { produitId: valeur });
  else if (type === 'about') naviguerVers('apropos');
  else naviguerVers('catalogue', {});
}

// Ouvre une catégorie à partir d'un élément portant data-cat (évite d'insérer
// le nom de la catégorie directement dans du code JavaScript).
function ouvrirCategorie(element) {
  naviguerVers('catalogue', { categorie: element.dataset.cat });
}

// Transforme un texte multi-paragraphes (séparés par une ligne vide) en <p> échappés.
function paragraphesHTML(texte) {
  return String(texte || '')
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(Boolean)
    .map(p => `<p>${echapper(p).replace(/\n/g, '<br>')}</p>`)
    .join('');
}

function normaliser(texte) {
  return (texte || '').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/s$/, ''); // retire un éventuel "s" final pour ignorer singulier/pluriel
}

/* ============================================================
   PANIER — persistance via localStorage, pour que le panier
   survive à un rechargement de page (propre à ce navigateur/appareil)
   ============================================================ */
function chargerPanierDepuisMemoire() {
  try {
    const brut = localStorage.getItem(CLE_PANIER);
    return brut ? JSON.parse(brut) : [];
  } catch (erreur) {
    console.error('Impossible de lire le panier sauvegardé :', erreur);
